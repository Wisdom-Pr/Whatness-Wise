<script>
  // ====== PASTE YOUR SUPABASE PROJECT CREDENTIALS HERE ======
  var SUPABASE_URL = "https://lzglfqvqoajjkvsmljjy.supabase.co";
  var SUPABASE_ANON_KEY = "sb_publishable_s5eanQJElKHGjxakr_FeaA_xoDGa_xj";
  // ============================================================

  var wiseSupabase = null;
  window.__wiseUser__ = null;
  window.__wiseUserPlan__ = "free";
  window.__wiseLookupsToday__ = 0;
  window.__wiseLookupDate__ = null;
  // "Today" in Addis Ababa time — the same day boundary the server uses.
  window.__wiseToday__ = function () {
    try {
      return new Date().toLocaleDateString("en-CA", { timeZone: "Africa/Addis_Ababa" });
    } catch (e) {
      return new Date().toISOString().slice(0, 10);
    }
  };
  window.__wiseIsSignedIn__ = function () {
    return !!window.__wiseUser__;
  };

  function accSetMsg(text, isError) {
    var el = document.getElementById("account-msg");
    el.textContent = text || "";
    el.style.color = isError ? "#ffd7d7" : "#cdeccb";
  }

  function accUpdateUI() {
    var signedOut = document.getElementById("account-signed-out-controls");
    var signedIn = document.getElementById("account-signed-in-controls");
    if (window.__wiseUser__) {
      signedOut.style.display = "none";
      signedIn.style.display = "inline-flex";
      document.getElementById("account-email-display").textContent = window.__wiseUser__.email || "";
      document.getElementById("account-plan-display").textContent = window.__wiseUserPlan__ || "free";

      var quotaEl = document.getElementById("account-quota-display");
      var upgradeBtn = document.getElementById("account-upgrade-btn");
      if (window.__wiseUserPlan__ === "free") {
        var today = window.__wiseToday__();
        var usedToday = window.__wiseLookupDate__ === today ? window.__wiseLookupsToday__ : 0;
        var remaining = Math.max(0, 5 - usedToday);
        quotaEl.textContent = " (" + remaining + "/5 lookups left today)";
        upgradeBtn.style.display = "inline-block";
      } else {
        quotaEl.textContent = window.__wiseProUntil__
          ? " (unlimited until " + window.__wiseProUntil__ + ")"
          : " (unlimited)";
        upgradeBtn.style.display = "none";
      }
    } else {
      signedOut.style.display = "inline-flex";
      signedIn.style.display = "none";
    }
    // Keep the key bar's "sign in above to use this" message in sync with real auth state
    if (typeof applyProviderUI === "function" && window.__wiseProvider__ === "shared") {
      applyProviderUI();
    }
  }

  var DODO_PRODUCT_ID = "pdt_0NoXbsm4Z0VtJtGQkHfYy";

  document.getElementById("account-upgrade-btn").addEventListener("click", function () {
    document.getElementById("upgrade-modal").style.display = "flex";
  });
  document.getElementById("upgrade-modal-close-btn").addEventListener("click", function () {
    document.getElementById("upgrade-modal").style.display = "none";
  });
  document.getElementById("upgrade-modal-pay-btn").addEventListener("click", function () {
    if (!window.__wiseUser__) {
      accSetMsg("Please sign in first before upgrading.", true);
      document.getElementById("upgrade-modal").style.display = "none";
      return;
    }
    var email = encodeURIComponent(window.__wiseUser__.email || "");
    var userId = encodeURIComponent(window.__wiseUser__.id || "");
    var redirectUrl = encodeURIComponent(window.location.origin + window.location.pathname);
    var payLink =
      "https://checkout.dodopayments.com/buy/" + DODO_PRODUCT_ID +
      "?quantity=1&email=" + email + "&disableEmail=true" +
      "&metadata_supabase_user_id=" + userId +
      "&redirect_url=" + redirectUrl;
    window.location.href = payLink;
  });

  async function accFetchProfile(userId) {
    try {
      var result = await wiseSupabase
        .from("profiles")
        .select("plan, lookups_today, lookup_date, pro_until")
        .eq("id", userId)
        .single();
      if (result.data) {
        var today = window.__wiseToday__();
        var rawPlan = result.data.plan || "free";
        var proUntil = result.data.pro_until || null;
        // An expired manually-granted Pro period quietly reverts to free in the
        // UI — no need to manually fix the database row when it lapses.
        var expired = rawPlan === "pro" && proUntil && proUntil < today;
        window.__wiseUserPlan__ = expired ? "free" : rawPlan;
        window.__wiseProUntil__ = expired ? null : proUntil;
        window.__wiseLookupsToday__ = result.data.lookups_today || 0;
        window.__wiseLookupDate__ = result.data.lookup_date || null;
      }
    } catch (e) {
      // profile row may not exist yet (trigger delay) — default 'free' stands
    }
    accUpdateUI();
  }

  if (window.supabase && SUPABASE_URL.indexOf("PASTE_YOUR") === -1) {
    wiseSupabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    wiseSupabase.auth.getSession().then(function (res) {
      var session = res.data && res.data.session;
      if (session && session.user) {
        window.__wiseUser__ = session.user;
        accFetchProfile(session.user.id);
      }
      accUpdateUI();
    });

    document.getElementById("account-signup-btn").addEventListener("click", async function () {
      var email = document.getElementById("account-email").value.trim();
      var password = document.getElementById("account-password").value;
      if (!email || password.length < 6) {
        accSetMsg("Enter an email and a password of at least 6 characters.", true);
        return;
      }
      accSetMsg("Signing up...");
      var res = await wiseSupabase.auth.signUp({ email: email, password: password });
      if (res.error) {
        accSetMsg(res.error.message, true);
        return;
      }
      if (res.data.session) {
        window.__wiseUser__ = res.data.user;
        accFetchProfile(res.data.user.id);
        accSetMsg("Signed up and logged in!");
      } else {
        accSetMsg("Check your email to confirm your account, then log in.");
      }
    });

    document.getElementById("account-login-btn").addEventListener("click", async function () {
      var email = document.getElementById("account-email").value.trim();
      var password = document.getElementById("account-password").value;
      if (!email || !password) {
        accSetMsg("Enter your email and password.", true);
        return;
      }
      accSetMsg("Logging in...");
      var res = await wiseSupabase.auth.signInWithPassword({ email: email, password: password });
      if (res.error) {
        accSetMsg(res.error.message, true);
        return;
      }
      window.__wiseUser__ = res.data.user;
      accFetchProfile(res.data.user.id);
      accSetMsg("");
    });

    document.getElementById("account-logout-btn").addEventListener("click", async function () {
      await wiseSupabase.auth.signOut();
      window.__wiseUser__ = null;
      window.__wiseUserPlan__ = "free";
      accSetMsg("Signed out.");
      accUpdateUI();
    });
  } else {
    // Accounts aren't set up yet — hide the whole bar rather than show a
    // permanently-broken sign-in form. Live filtering works via API key alone.
    document.getElementById("accountbar").style.display = "none";
  }
</script>

<script>
  var WISE_PROVIDER_STORAGE = "wise_api_provider";
  var PROVIDER_KEY_STORAGE = {
    gemini: "wise_gemini_api_key",
    anthropic: "wise_anthropic_api_key",
  };
  var PROVIDER_META = {
    gemini: { placeholder: "AIza...", note: "Saved only in this browser on this device — never sent anywhere but Google's API." },
    anthropic: { placeholder: "sk-ant-...", note: "Saved only in this browser on this device — never sent anywhere but Anthropic's API." },
  };

  window.__wiseProvider__ = "shared"; // default: free shared backend, no key needed

  function currentProviderStorageKey() {
    return PROVIDER_KEY_STORAGE[window.__wiseProvider__];
  }

  // Read the key straight from the input at call time (callClaude does this directly),
  // so it works even if a password manager fills the field without firing "input".
  window.__getWiseApiKey__ = function () {
    var el = document.getElementById("apikey");
    return el ? el.value.trim() : "";
  };

  function refreshKeyStatus() {
    if (window.__wiseProvider__ === "shared") return; // handled by applyProviderUI instead
    var status = document.getElementById("keybar-status");
    var forgetBtn = document.getElementById("forget-key-btn");
    var has = window.__getWiseApiKey__().length > 0;
    status.textContent = has ? "✓ key set" : "not set";
    status.style.color = has ? "#7fd08a" : "#b7bdae";
    forgetBtn.style.display = has ? "inline-block" : "none";
  }

  function saveKeyToStorage(key) {
    try {
      var storageKey = currentProviderStorageKey();
      if (!storageKey) return; // shared backend has nothing to store
      if (key) {
        localStorage.setItem(storageKey, key);
      } else {
        localStorage.removeItem(storageKey);
      }
    } catch (e) {
      // localStorage may be unavailable (e.g. private browsing); the key still works for this session
    }
  }

  function loadKeyForCurrentProvider() {
    var apikeyEl = document.getElementById("apikey");
    var storageKey = currentProviderStorageKey();
    if (!storageKey) {
      apikeyEl.value = "";
      window.__wiseApiKeyCache__ = "";
      return;
    }
    try {
      var saved = localStorage.getItem(storageKey);
      apikeyEl.value = saved || "";
      window.__wiseApiKeyCache__ = saved || "";
    } catch (e) {
      apikeyEl.value = "";
    }
    refreshKeyStatus();
  }

  function applyProviderUI() {
    var apikeyEl = document.getElementById("apikey");
    var statusEl = document.getElementById("keybar-status");
    var forgetBtn = document.getElementById("forget-key-btn");
    var noteEl = document.getElementById("keybar-note");

    if (window.__wiseProvider__ === "shared") {
      apikeyEl.style.display = "none";
      forgetBtn.style.display = "none";
      var signedIn = window.__wiseIsSignedIn__ && window.__wiseIsSignedIn__();
      statusEl.textContent = signedIn ? "✓ signed in — ready" : "sign in above to use this";
      statusEl.style.color = signedIn ? "#7fd08a" : "#f2c14e";
      noteEl.textContent = "Uses WiseDefine's shared free access — no key needed, just sign in.";
      return;
    }

    apikeyEl.style.display = "";
    var meta = PROVIDER_META[window.__wiseProvider__];
    apikeyEl.placeholder = meta.placeholder;
    noteEl.textContent = meta.note;
    refreshKeyStatus();
  }

  var apikeyEl = document.getElementById("apikey");
  var providerSelect = document.getElementById("provider-select");

  // Restore last-chosen provider, if any (defaults to gemini otherwise)
  try {
    var savedProvider = localStorage.getItem(WISE_PROVIDER_STORAGE);
    if (savedProvider === "gemini" || savedProvider === "anthropic") {
      window.__wiseProvider__ = savedProvider;
    }
  } catch (e) {}
  providerSelect.value = window.__wiseProvider__;
  applyProviderUI();
  loadKeyForCurrentProvider();

  providerSelect.addEventListener("change", function () {
    window.__wiseProvider__ = providerSelect.value;
    try {
      localStorage.setItem(WISE_PROVIDER_STORAGE, window.__wiseProvider__);
    } catch (e) {}
    applyProviderUI();
    loadKeyForCurrentProvider();
  });

  ["input", "change", "keyup", "paste"].forEach(function (evt) {
    apikeyEl.addEventListener(evt, function () {
      // paste fires before the value is updated in some browsers, so re-check on a tick
      setTimeout(function () {
        refreshKeyStatus();
        saveKeyToStorage(window.__getWiseApiKey__());
      }, 0);
    });
  });

  document.getElementById("forget-key-btn").addEventListener("click", function () {
    apikeyEl.value = "";
    window.__wiseApiKeyCache__ = "";
    saveKeyToStorage("");
    refreshKeyStatus();
  });

  refreshKeyStatus();

  // --- Service worker: makes the app fully installable on Android Chrome
  // (not just a browser shortcut) and lets it reopen offline once visited.
  if ("serviceWorker" in navigator) {
    // Was a service worker already running this page before we started?
    // If not, this is a first install and no reload is needed.
    var hadController = !!navigator.serviceWorker.controller;
    var alreadyReloading = false;

    // When a NEW service worker takes control, reload once so the freshly
    // uploaded version of the app is what the user actually sees.
    navigator.serviceWorker.addEventListener("controllerchange", function () {
      if (!hadController || alreadyReloading) return;
      alreadyReloading = true;
      window.location.reload();
    });

    window.addEventListener("load", function () {
      navigator.serviceWorker
        .register("sw.js")
        .then(function (registration) {
          // Check for a newer version every time the app is opened.
          registration.update();
        })
        .catch(function () {
          // Fails harmlessly on browsers/origins that don't support it (e.g. no HTTPS)
        });
    });
  }

  // --- Custom "Install App" button, using the native browser install prompt
  // where supported (Chrome/Edge on desktop and Android). Browsers that don't
  // support this event (Firefox, Safari) simply never show the button, and
  // users there still use the manual Add to Home Screen / Install menu option.
  var deferredInstallPrompt = null;
  var installBtn = document.getElementById("install-app-btn");

  window.addEventListener("beforeinstallprompt", function (e) {
    e.preventDefault();
    deferredInstallPrompt = e;
    installBtn.style.display = "inline-block";
  });

  installBtn.addEventListener("click", function () {
    if (!deferredInstallPrompt) return;
    deferredInstallPrompt.prompt();
    deferredInstallPrompt.userChoice.finally(function () {
      deferredInstallPrompt = null;
      installBtn.style.display = "none";
    });
  });

  window.addEventListener("appinstalled", function () {
    installBtn.style.display = "none";
  });
</script>

1. Find the WHAT (what the concept fundamentally is)

4. Identify the result (what it produces, determines, represents, or affects)
5. Test discrimination (could this definition describe another concept? if yes, it's weak)
6. Test circularity (does it just repeat the term itself?)
7. Test completeness (enough to distinguish it, without becoming a paragraph)

CRITICAL — do not settle for the most common textbook phrasing just because it's what's usually taught. The single most common phrasing is very often generic enough to fail Rule 5. Example: "Energy is the capacity to do work" fails Rule 5, because it could equally describe force or power. The fix is not better wording of the same idea — it is finding the one fact that is uniquely true of THIS concept and no closely related one: for energy, that is the conservation law ("cannot be created or destroyed"). Look for a conservation law, an invariant, a defining formula, a unique unit, or a structural property that only this term has, and use THAT as the discriminating clause — even if the standard definition you were given doesn't mention it. Getting the discriminating fact right matters more than staying close to the wording you were given.

CRITICAL — cross-domain completeness. A term's most common definition often comes from just one field (usually physics) and can be too narrow once the term is also used in engineering, social science, or another discipline this dictionary covers. Example: "Force is a push or pull that changes an object's motion" is a physics-only definition. It misses that in structural engineering, force also produces deformation in objects that never move at all (a loaded column in static equilibrium). The corrected version must cover every discipline the term is actually used in: "Force is a push or pull one object exerts on another, changing its state of motion or its structural form." Before finalizing, ask: is this term used in more than one field this dictionary covers, and does my definition only account for one of them?

CRITICAL — family-member discrimination. Some concepts belong to a tight family of near-neighbors that a generic definition will accidentally cover all of (not just one unrelated concept, but several close ones). Example: "a push or pull that changes structural form" alone doesn't yet distinguish force from pressure or stress, since those are also push/pull interactions that deform matter — the difference is that force acts as a whole, while pressure and stress are force normalized by area. When a term has such neighbors, add the scoping word or phrase that excludes them (e.g., "as a whole," "at a point," "per unit area") rather than assuming the base definition already does.

CRITICAL — canonical terminology. Use the exact standard term-of-art a trained practitioner in the field would use, not a near-synonym that sounds slightly off (e.g., write "state of motion," not "status of motion" — physics uses "state," not "status"). A definition can be structurally correct and still undercut the app's academic standard through one wrong word.

CRITICAL — self-synonym circularity. Rule 6 (circularity) isn't limited to literally repeating the term — it also catches defining a term using a grammatical cousin of itself (an adjective, adverb, or informal form that means the same thing). Example: "Speed measures how fast an object moves" defines speed using "fast," which is just the adjective form of speed — this LOOKS non-circular because the words differ, but it's the same failure as restating the term. Before finalizing, check every content word in your definition against the term itself: if any of them is a synonym, adjective form, or colloquial stand-in for the term being defined, replace it with the actual measurable relationship instead.

CRITICAL — ratio/rate completeness. If the term is a rate, ratio, or measured quantity (speed, density, pressure, momentum, acceleration, etc.), a proper definition must name BOTH quantities in its defining relationship, not just one. Example: "Speed measures how much distance an object covers" is incomplete — it names distance but drops time, and speed is specifically distance per unit time. The corrected form is "Speed is a scalar quantity that measures how much distance an object covers in a given time." Before finalizing a rate/ratio term, check: have I named both halves of the relationship, not just one?

CRITICAL — concision and directness. Even a definition with the right facts can read as heavy if the phrasing is roundabout. Watch for: (a) repeated quantifiers in one sentence ("all... all," "every... every") which read as padding rather than emphasis; (b) indirect verbs standing in for a direct relationship (e.g., "standards that measure laws" instead of the more direct "laws must meet the standard"). Example: "the binding standards that measure all other laws and government actions" tightens to "the standard all other laws must meet" — same fact, half the words, easier to read aloud. Keep every discriminating fact, but say it in the most direct sentence possible.

   6. Test circularity (does it just repeat the term itself?)
   7. Test completeness (enough to distinguish it, without becoming a paragraph)

CRITICAL — the most common textbook phrasing is very often too generic to pass Rule 5, precisely because it's the phrasing everyone repeats without checking it. Example: "Energy is the capacity to do work" fails Rule 5 because it could equally describe force or power. The fix is not to reword that sentence — it's to find the one fact that is uniquely true of THIS concept and not of its closest neighbors: for energy, that's the conservation law ("cannot be created or destroyed"). Actively search for a conservation law, an invariant, a defining formula, a unique unit, or a structural property that only this term has, and use THAT as the discriminating clause, even if the most common phrasing of the term omits it. Do not output a definition that could be defended as "technically what's usually said" if it still fails your own discrimination test.

CRITICAL — cross-domain completeness. A term's most common definition often comes from just one field (usually physics) and can be too narrow once the term is also used in engineering, social science, or another discipline this dictionary covers. Example: "Force is a push or pull that changes an object's motion" is a physics-only definition. It misses that in structural engineering, force also produces deformation in objects that never move at all (a loaded column in static equilibrium). The corrected version must cover every discipline the term is actually used in: "Force is a push or pull one object exerts on another, changing its state of motion or its structural form." Before finalizing, ask: is this term used in more than one field, and does my definition only account for one of them?

CRITICAL — family-member discrimination. Some concepts belong to a tight family of near-neighbors that a generic definition accidentally covers all of. Example: "a push or pull that changes structural form" alone doesn't distinguish force from pressure or stress, since those also deform matter — the real difference is that force acts as a whole, while pressure and stress are force normalized by area. When a term has such neighbors, add the scoping word that excludes them (e.g., "as a whole," "at a point," "per unit area") rather than assuming the base definition already does.

CRITICAL — canonical terminology. Use the exact standard term-of-art a trained practitioner would use, not a near-synonym that sounds slightly off (e.g., write "state of motion," not "status of motion"). A definition can be structurally sound and still undercut the app's academic standard through one wrong word.

CRITICAL — self-synonym circularity. Rule 6 also catches defining a term using a grammatical cousin of itself. Example: "Speed measures how fast an object moves" defines speed using "fast" — the adjective form of speed itself. This looks non-circular because the words differ, but it's the same failure as restating the term. Check every content word in your final definition against the term: if any word is a synonym, adjective form, or colloquial stand-in for the term, replace it with the actual measurable relationship.

CRITICAL — ratio/rate completeness. If the term is a rate, ratio, or measured quantity (speed, density, pressure, momentum, acceleration, etc.), the definition must name BOTH quantities in the defining relationship, not just one. Example: "Speed measures how much distance an object covers" is incomplete — it drops time. The corrected form is "Speed is a scalar quantity that measures how much distance an object covers in a given time." Before finalizing a rate/ratio term, check that both halves of the relationship are named.

CRITICAL — concision and directness. Even a definition with the right facts can read as heavy if the phrasing is roundabout. Watch for repeated quantifiers ("all... all") and indirect verbs standing in for a direct relationship ("standards that measure laws" instead of "laws must meet the standard"). Example: "the binding standards that measure all other laws and government actions" tightens to "the standard all other laws must meet" — same fact, fewer words, easier to read aloud. Keep every discriminating fact, but state it as directly as possible.

3. Extract four fields: category, identity, mechanism, problem (the discrimination/circularity/condition weakness you found in the standard definition; if none, say "None").
4. Rewrite the definition as ONE plain sentence in the pattern "[Term] is the/a [core WHAT] ... that/exercised through/produced by [discriminating mechanism]." Use vocabulary a first-time student already knows — no jargon that itself needs defining. One sentence only.
5. Also classify the term's domain in a couple of words (e.g. "Structural Engineering", "Social Science", "Physics", "Biology"). If it applies to more than one, name the discipline whose usage your final sentence covers most completely.

If the term is not a real, recognizable academic word, phrase, or clause, respond with exactly: {"error":"not_found"}

Otherwise respond with ONLY minified JSON, no markdown fences, no preamble, in exactly this shape:
{"domain":"...","standard":"...","category":"...","identity":"...","mechanism":"...","problem":"...","definition":"..."}`;

function extractJson(rawText) {
  const match = rawText.match(/\{[\s\S]*\}/);
  const jsonText = match ? match[0] : rawText;
  return JSON.parse(jsonText);
}

async function getApiKeyOrPrompt(providerLabel, placeholderHint) {
  let apiKey = (window.__getWiseApiKey__ ? window.__getWiseApiKey__() : "").trim();

  if (!apiKey && window.__wiseApiKeyCache__) {
    apiKey = window.__wiseApiKeyCache__;
  }

  if (!apiKey) {
    const entered = window.prompt(
      `Paste your ${providerLabel} API key (${placeholderHint}).\n\nIt's sent directly to that provider's API, and saved only in this browser on this device so you won't be asked again here.`
    );
    if (entered && entered.trim()) {
      apiKey = entered.trim();
      window.__wiseApiKeyCache__ = apiKey;
      const field = document.getElementById("apikey");
      if (field) field.value = apiKey;
      if (typeof refreshKeyStatus === "function") refreshKeyStatus();
      if (typeof saveKeyToStorage === "function") saveKeyToStorage(apiKey);
    }
  }

  if (!apiKey) {
    throw new Error("An API key is required to use live filtering.");
  }
  return apiKey;
}

async function callAnthropic(system, userContent) {
  const apiKey = await getApiKeyOrPrompt("Anthropic", "from platform.claude.com, starts with sk-ant-...");

  const response = await fetch("https://api.anthropic.com/v1/messages", {
    method: "POST",
    headers: {
      "Content-Type": "application/json",
      "x-api-key": apiKey,
      "anthropic-version": "2023-06-01",
      "anthropic-dangerous-direct-browser-access": "true",
    },
    body: JSON.stringify({
      model: "claude-sonnet-4-6",
      max_tokens: 1500,
      system: system,
      messages: [{ role: "user", content: userContent }],
    }),
  });

  if (!response.ok) {
    const errText = await response.text();
    if (response.status === 401) {
      const masked =
        apiKey.length > 14
          ? apiKey.slice(0, 10) + "..." + apiKey.slice(-4) + " (length " + apiKey.length + ")"
          : "(too short to be a real key — length " + apiKey.length + ")";
      throw new Error(
        `API returned 401 (key not recognized). What was actually sent: ${masked}. ` +
        `A real Anthropic key looks like sk-ant-api03-... and is much longer than 14 characters. ` +
        `Raw error: ${errText.slice(0, 150)}`
      );
    }
    throw new Error(`API returned ${response.status}: ${errText.slice(0, 200)}`);
  }

  const data = await response.json();
  if (data.error) throw new Error(data.error.message || "API returned an error.");

  const rawText = (data.content || [])
    .map((block) => (block.type === "text" ? block.text : ""))
    .join("")
    .trim();

  if (!rawText) {
    throw new Error(
      data.stop_reason
        ? `The model stopped without returning text (reason: ${data.stop_reason}). Try again.`
        : "The model returned no text content to parse."
    );
  }

  try {
    return extractJson(rawText);
  } catch (parseErr) {
    if (data.stop_reason === "max_tokens") {
      throw new Error(
        `The response got cut off before finishing (hit the token limit). Raw reply: ${rawText.slice(0, 300)}`
      );
    }
    throw new Error(`Couldn't parse the model's response as JSON. Raw reply: ${rawText.slice(0, 300)}`);
  }
}

async function callGemini(system, userContent) {
  const apiKey = await getApiKeyOrPrompt("Google AI Studio", "from aistudio.google.com/apikey");

  const response = await fetch(
    `https://generativelanguage.googleapis.com/v1beta/models/gemini-3.6-flash:generateContent?key=${encodeURIComponent(apiKey)}`,
    {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        systemInstruction: { parts: [{ text: system }] },
        contents: [{ role: "user", parts: [{ text: userContent }] }],
        generationConfig: {
          maxOutputTokens: 2048,
          temperature: 0.4,
          thinkingConfig: { thinkingLevel: "low" },
        },
      }),
    }
  );

  if (!response.ok) {
    const errText = await response.text();
    throw new Error(`API returned ${response.status}: ${errText.slice(0, 200)}`);
  }

  const data = await response.json();
  if (data.error) throw new Error(data.error.message || "API returned an error.");

  const candidate = (data.candidates || [])[0];
  const rawText = ((candidate && candidate.content && candidate.content.parts) || [])
    .map((p) => p.text || "")
    .join("")
    .trim();

  if (!rawText) {
    const finishReason = candidate && candidate.finishReason;
    throw new Error(
      finishReason
        ? `The model stopped without returning text (reason: ${finishReason}). Try again.`
        : "The model returned no text content to parse."
    );
  }

  try {
    return extractJson(rawText);
  } catch (parseErr) {
    const finishReason = candidate && candidate.finishReason;
    if (finishReason === "MAX_TOKENS") {
      throw new Error(
        `The response got cut off before finishing (hit the token limit). Raw reply: ${rawText.slice(0, 300)}`
      );
    }
    throw new Error(`Couldn't parse the model's response as JSON. Raw reply: ${rawText.slice(0, 300)}`);
  }
}

async function callSharedBackend(system, userContent) {
  if (!wiseSupabase) {
    throw new Error("Shared access isn't available right now — try 'My own Google Gemini key' instead.");
  }
  if (!(window.__wiseIsSignedIn__ && window.__wiseIsSignedIn__())) {
    throw new Error("Please sign in above (free, just an email + password) to use WiseDefine's shared free access.");
  }

  const sessionRes = await wiseSupabase.auth.getSession();
  const accessToken = sessionRes.data && sessionRes.data.session && sessionRes.data.session.access_token;
  if (!accessToken) {
    throw new Error("Your sign-in session has expired — please sign in again.");
  }

  const response = await fetch(`${SUPABASE_URL}/functions/v1/filter-definition`, {
    method: "POST",
    headers: {
      "Content-Type": "application/json",
      Authorization: `Bearer ${accessToken}`,
    },
    body: JSON.stringify({ system, userContent }),
  });

  if (!response.ok) {
    const errText = await response.text();
    let errJson = null;
    try { errJson = JSON.parse(errText); } catch (e) {}

    // Daily free limit reached — the server is the only one that decides this.
    if (errJson && errJson.error === "limit_reached") {
      window.__wiseLookupsToday__ = 5;
      window.__wiseLookupDate__ = window.__wiseToday__();
      if (typeof accUpdateUI === "function") accUpdateUI();
      const modal = document.getElementById("upgrade-modal");
      if (modal) modal.style.display = "flex";
      throw new Error(
        (errJson && errJson.message) ||
        "You've used your 5 free lookups today. Upgrade to Pro for unlimited lookups, or come back tomorrow."
      );
    }

    if (response.status === 401) {
      throw new Error("Your sign-in session has expired — please sign out and sign in again.");
    }
    // A 429 that is NOT our daily limit comes from the AI service itself
    // (its own usage quota is exhausted for now) — not the user's fault.
    if (response.status === 429) {
      throw new Error("WiseDefine's AI service is at capacity right now — please try again a little later.");
    }
    throw new Error("WiseDefine couldn't complete this lookup right now — please try again in a moment.");
  }

  const data = await response.json();

  // Keep the "x/5 lookups left today" line in step with the server's count.
  if (data.quota && data.quota.plan === "free" && typeof data.quota.remaining === "number") {
    window.__wiseLookupsToday__ = Math.max(0, 5 - data.quota.remaining);
    window.__wiseLookupDate__ = window.__wiseToday__();
    if (typeof accUpdateUI === "function") accUpdateUI();
  }
  if (data.error) throw new Error(data.error.message || data.error || "Shared backend returned an error.");

  const candidate = (data.candidates || [])[0];
  const rawText = ((candidate && candidate.content && candidate.content.parts) || [])
    .map((p) => p.text || "")
    .join("")
    .trim();

  if (!rawText) {
    throw new Error("The shared backend returned no text content to parse.");
  }

  try {
    return extractJson(rawText);
  } catch (parseErr) {
    throw new Error(`Couldn't parse the shared backend's response as JSON. Raw reply: ${rawText.slice(0, 300)}`);
  }
}

async function callClaude(system, userContent) {
  const provider = window.__wiseProvider__ || "shared";
  if (provider === "shared") {
    return callSharedBackend(system, userContent);
  }
  if (provider === "anthropic") {
    return callAnthropic(system, userContent);
  }
  return callGemini(system, userContent);
}

function slugify(term) {
  return term
    .toLowerCase()
    .trim()
    .replace(/[^a-z0-9]+/g, "-")
    .replace(/(^-|-$)/g, "");
}

function PipelineTab({ onSave }) {
  const [term, setTerm] = useState("");

  const [result, setResult] = useState(null);
  const [loading, setLoading] = useState(false);
  const [error, setError] = useState("");

  const run = async () => {
    if (!term.trim() || !raw.trim()) {
      setError("Enter both a term and its standard definition.");
      return;
    }
    setError("");
    setLoading(true);
    setResult(null);
    try {
      const parsed = await callClaude(
        SYSTEM_PROMPT,
        `Term: ${term}\nStandard definition: ${raw}`
      );
      if (!parsed.definition) {
        throw new Error("Response parsed but had no 'definition' field. Raw: " + JSON.stringify(parsed).slice(0, 300));
      }
      setResult(parsed);
      if (onSave) {
        onSave({
          id: slugify(term),
          term,
          domain: "Custom",
          definition: parsed.definition,
          pair: null,
          fields: {

            identity: parsed.identity,
            mechanism: parsed.mechanism,
            problem: parsed.problem,
          },
        });

          fontSize: 15,
          padding: "9px 10px",
          border: `1px solid ${RULE}`,
          borderRadius: 3,
          marginBottom: 14,
          background: "#FDFCF7",
          color: INK,
        }}
      />

      <label style={{ display: "block", fontFamily: "ui-sans-serif, system-ui", fontSize: 12, fontWeight: 600, color: NAVY, marginBottom: 4 }}>
        Standard definition
      </label>
      <textarea
        value={raw}
        onChange={(e) => setRaw(e.target.value)}
        placeholder="Paste the textbook definition here..."
        rows={4}
        style={{
          width: "100%",
          boxSizing: "border-box",
          fontFamily: "ui-serif, Georgia, serif",
          fontSize: 15,
          padding: "9px 10px",

function WiseApp() {
  const [tab, setTab] = useState("browse");
  const [entries, setEntries] = useState(SEED_ENTRIES);
  const [expandedId, setExpandedId] = useState(SEED_ENTRIES[0].id);
  const [query, setQuery] = useState("");
  const [lookupLoading, setLookupLoading] = useState(false);
  const [lookupError, setLookupError] = useState("");

  const normalize = (s) => s.toLowerCase().replace(/[-_\s]+/g, " ").trim();

  const filtered = entries.filter((e) => {
    const q = normalize(query);
    if (!q) return true;
    const termWords = normalize(e.term).split(" ");
    const domainWords = normalize(e.domain).split(" ");
    const qWords = q.split(" ");
    const containsAsSubstring =
      normalize(e.term).includes(q) || normalize(e.domain).includes(q);
    const allWordsPrefixMatch = qWords.every((qw) =>
      [...termWords, ...domainWords].some((w) => w.startsWith(qw))
    );
    return containsAsSubstring || allWordsPrefixMatch;
  });

  // Whether the query matches an existing TERM specifically (ignores domain labels like
  // "Physics" or "Law" so a query that only overlaps a domain name doesn't block lookup).
  const hasTermMatch = entries.some((e) => {
    const q = normalize(query);
    if (!q) return true;
    const termWords = normalize(e.term).split(" ");
    const qWords = q.split(" ");
    const containsAsSubstring = normalize(e.term).includes(q);
    const allWordsPrefixMatch = qWords.every((qw) => termWords.some((w) => w.startsWith(qw)));
    return containsAsSubstring || allWordsPrefixMatch;
  });

  const addEntry = (entry) => {
    setEntries((prev) => {
      const withoutDupe = prev.filter((e) => e.id !== entry.id);
      return [...withoutDupe, entry];
    });
    setExpandedId(entry.id);
  };

  const lookupAndFilter = async () => {
    const term = query.trim();
    if (!term) return;
    setLookupError("");
    setLookupLoading(true);
    try {
      const parsed = await callClaude(LOOKUP_SYSTEM_PROMPT, `Term: ${term}`);
      if (parsed.error === "not_found") {
        throw new Error(
          `"${term}" isn't recognized as an academic word, phrase, or clause. Check the spelling, or try "Filter a term" to supply your own standard definition.`
        );
      }
      if (!parsed.definition) {
        throw new Error("Response parsed but had no 'definition' field. Raw: " + JSON.stringify(parsed).slice(0, 300));
      }
      addEntry({
        id: slugify(term),
        term,
        domain: parsed.domain || "General",
        definition: parsed.definition,
        pair: null,
        fields: {
          category: parsed.category,
          identity: parsed.identity,
          mechanism: parsed.mechanism,
          problem: parsed.problem,
        },
      });
      setQuery("");
    } catch (e) {
      setLookupError(e.message || "Couldn't look that term up. Try again.");
    } finally {
      setLookupLoading(false);
    }
  };

  return (
    <div style={{ background: PAPER, minHeight: "100%", display: "flex", justifyContent: "center" }}>
      <div style={{ width: "100%", maxWidth: 480, padding: "22px 20px 60px" }}>
        {/* Header */}
        <div style={{ display: "flex", alignItems: "center", gap: 12, marginBottom: 4 }}>
          <img src={EMBLEM_SRC} alt="" style={{ width: 44, height: 44, flexShrink: 0 }} />
          <div>
            <div style={{ fontFamily: "ui-serif, Georgia, serif", fontSize: 24, fontWeight: 700, color: INK, letterSpacing: "0.01em" }}>
              WiseDefine
            </div>
            <div style={{ fontFamily: "ui-sans-serif, system-ui", fontSize: 11.5, color: NAVY }}>
              Definitions, reasoned to their what-ness
            </div>
          </div>
        </div>

        <div style={{ height: 1, background: INK, margin: "16px 0 14px" }} />

        {/* Tabs */}
        <div style={{ display: "flex", gap: 4, marginBottom: 18 }}>
          {[
            { id: "browse", label: "Dictionary" },
            { id: "pipeline", label: "Filter a term" },
          ].map((t) => (
            <button
              key={t.id}
              onClick={() => setTab(t.id)}
              style={{
                all: "unset",
                cursor: "pointer",
                fontFamily: "ui-sans-serif, system-ui",
                fontSize: 13,
                fontWeight: 600,
                padding: "7px 14px",
                borderRadius: 3,
                color: tab === t.id ? PAPER : INK,
                background: tab === t.id ? INK : "transparent",
                border: `1px solid ${INK}`,
              }}
            >
              {t.label}
            </button>
          ))}
        </div>

        {tab === "browse" ? (
          <div>
            <div style={{ display: "flex", gap: 6, marginBottom: 6 }}>
              <input
                value={query}
                onChange={(e) => setQuery(e.target.value)}
                onKeyDown={(e) => {
                  if (e.key === "Enter" && !hasTermMatch) lookupAndFilter();
                }}
                placeholder="Search, or type a new term to define..."
                style={{
                  flex: 1,
                  minWidth: 0,
                  boxSizing: "border-box",
                  fontFamily: "ui-serif, Georgia, serif",
                  fontSize: 15,
                  padding: "9px 10px",
                  border: `1px solid ${RULE}`,
                  borderRadius: 3,
                  background: "#FDFCF7",
                  color: INK,
                }}
              />
            </div>

            {!hasTermMatch && query.trim() && (
              <div style={{ marginTop: 8, marginBottom: 14 }}>
                <p style={{ fontFamily: "ui-sans-serif, system-ui", fontSize: 13, color: NAVY, marginBottom: 10 }}>
                  "{query.trim()}" isn't in the dictionary yet. WiseDefine can look up its standard definition and run it
                  through the filter automatically.
                </p>
                <button
                  onClick={lookupAndFilter}
                  disabled={lookupLoading}
                  style={{
                    fontFamily: "ui-sans-serif, system-ui",
                    fontSize: 13,
                    fontWeight: 600,
                    letterSpacing: "0.02em",
                    color: PAPER,
                    background: lookupLoading ? "#8a8f7a" : PINE,
                    border: "none",
                    borderRadius: 3,
                    padding: "10px 18px",
                    cursor: lookupLoading ? "default" : "pointer",
                  }}
                >
                  {lookupLoading ? "Looking up & filtering…" : `Look up & filter "${query.trim()}"`}
                </button>
                {lookupError && (
                  <p style={{ fontFamily: "ui-sans-serif, system-ui", fontSize: 13, color: CRIMSON, marginTop: 10 }}>
                    {lookupError}
                  </p>
                )}
                {filtered.length > 0 && (
                  <p style={{ fontFamily: "ui-sans-serif, system-ui", fontSize: 12, color: NAVY, marginTop: 10, fontStyle: "italic" }}>
                    Showing {filtered.length} existing entr{filtered.length === 1 ? "y" : "ies"} in a related field below.
                  </p>
                )}
              </div>
            )}

            {filtered.map((entry) => (
              <EntryCard
                key={entry.id}
                entry={entry}
                entries={entries}
                expanded={expandedId === entry.id}
                onToggle={() => setExpandedId(expandedId === entry.id ? null : entry.id)}
              />
            ))}
          </div>
        ) : (
          <PipelineTab onSave={addEntry} />
        )}
      </div>
    </div>
  );
}


async function wiseCheckEnabledAndMount() {
  const rootEl = document.getElementById("root");
  let enabled = true;
  let message = "WiseDefine is temporarily unavailable. Please check back soon.";

  if (wiseSupabase) {
    try {
      const { data, error } = await wiseSupabase
        .from("app_settings")
        .select("is_enabled, maintenance_message")
        .eq("id", 1)
        .single();
      if (!error && data) {
        enabled = data.is_enabled;
        if (data.maintenance_message) message = data.maintenance_message;
      }
    } catch (e) {
      // If the check itself fails (network hiccup, table not set up yet),
      // fail OPEN — show the app rather than locking everyone out by accident.
    }
  }

  if (!enabled) {
    var accountbarEl = document.getElementById("accountbar");
    var keybarEl = document.getElementById("keybar");
    if (accountbarEl) accountbarEl.style.display = "none";
    if (keybarEl) keybarEl.style.display = "none";

    rootEl.innerHTML =
      '<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;background:#F7F4EC;padding:24px;text-align:center;font-family:ui-serif,Georgia,serif;">' +
      '<div><div style="font-size:28px;font-weight:700;color:#14161C;margin-bottom:12px;">WiseDefine</div>' +
      '<div style="font-size:16px;color:#2C4870;max-width:420px;">' +
      message.replace(/</g, "&lt;") +
      "</div></div></div>";
    return;
  }

  const root = ReactDOM.createRoot(rootEl);
  root.render(<WiseApp />);
}

wiseCheckEnabledAndMount();
</script>

</body>
</html>
