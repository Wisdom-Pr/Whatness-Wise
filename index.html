<body>

<div id="accountbar">
  <span id="account-signed-out-controls">
    <input id="account-email" type="email" placeholder="Email" autocomplete="username" />
    <input id="account-password" type="password" placeholder="Password (6+ chars)" autocomplete="current-password" />
    <button id="account-signup-btn" type="button">Sign Up</button>
    <button id="account-login-btn" type="button" class="secondary">Log In</button>
  </span>
  <span id="account-signed-in-controls" style="display:none;">
    <span class="note">Signed in as <strong id="account-email-display"></strong> · Plan: <strong id="account-plan-display">free</strong></span>
    <button id="account-logout-btn" type="button" class="secondary">Sign Out</button>
  </span>
  <span id="account-msg"></span>
</div>

<script>
  // ====== PASTE YOUR SUPABASE PROJECT CREDENTIALS HERE ======
  var SUPABASE_URL = "PASTE_YOUR_SUPABASE_PROJECT_URL_HERE";
  var SUPABASE_ANON_KEY = "PASTE_YOUR_SUPABASE_ANON_PUBLIC_KEY_HERE";
  // ============================================================

  var wiseSupabase = null;
  window.__wiseUser__ = null;
  window.__wiseUserPlan__ = "free";
  window.__wiseIsSignedIn__ = function () {
    return !!window.__wiseUser__;
  };

  function accSetMsg(text, isError) {
    var el = document.getElementById("account-msg");
    el.textContent = text || "";
    el.style.color = isError ? "#ffd7d7" : "#cdeccb";
  }

  function accUpdateUI() {
    var signedOut = document.getElementById("account-signed-out-controls");
    var signedIn = document.getElementById("account-signed-in-controls");
    if (window.__wiseUser__) {
      signedOut.style.display = "none";
      signedIn.style.display = "inline-flex";
      document.getElementById("account-email-display").textContent = window.__wiseUser__.email || "";
      document.getElementById("account-plan-display").textContent = window.__wiseUserPlan__ || "free";
    } else {
      signedOut.style.display = "inline-flex";
      signedIn.style.display = "none";
    }
  }

  async function accFetchProfile(userId) {
    try {
      var result = await wiseSupabase.from("profiles").select("plan").eq("id", userId).single();
      if (result.data && result.data.plan) {
        window.__wiseUserPlan__ = result.data.plan;
      }
    } catch (e) {
      // profile row may not exist yet (trigger delay) — default 'free' stands
    }
    accUpdateUI();
  }

  if (window.supabase && SUPABASE_URL.indexOf("PASTE_YOUR") === -1) {
    wiseSupabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    wiseSupabase.auth.getSession().then(function (res) {
      var session = res.data && res.data.session;
      if (session && session.user) {
        window.__wiseUser__ = session.user;
        accFetchProfile(session.user.id);
      }
      accUpdateUI();
    });

    document.getElementById("account-signup-btn").addEventListener("click", async function () {
      var email = document.getElementById("account-email").value.trim();
      var password = document.getElementById("account-password").value;
      if (!email || password.length < 6) {
        accSetMsg("Enter an email and a password of at least 6 characters.", true);
        return;
      }
      accSetMsg("Signing up...");
      var res = await wiseSupabase.auth.signUp({ email: email, password: password });
      if (res.error) {
        accSetMsg(res.error.message, true);
        return;
      }
      if (res.data.session) {
        window.__wiseUser__ = res.data.user;
        accFetchProfile(res.data.user.id);
        accSetMsg("Signed up and logged in!");
      } else {
        accSetMsg("Check your email to confirm your account, then log in.");
      }
    });

    document.getElementById("account-login-btn").addEventListener("click", async function () {
      var email = document.getElementById("account-email").value.trim();
      var password = document.getElementById("account-password").value;
      if (!email || !password) {
        accSetMsg("Enter your email and password.", true);
        return;
      }
      accSetMsg("Logging in...");
      var res = await wiseSupabase.auth.signInWithPassword({ email: email, password: password });
      if (res.error) {
        accSetMsg(res.error.message, true);
        return;
      }
      window.__wiseUser__ = res.data.user;
      accFetchProfile(res.data.user.id);
      accSetMsg("");
    });

    document.getElementById("account-logout-btn").addEventListener("click", async function () {
      await wiseSupabase.auth.signOut();
      window.__wiseUser__ = null;
      window.__wiseUserPlan__ = "free";
      accSetMsg("Signed out.");
      accUpdateUI();
    });
  } else {
    // Accounts aren't set up yet — hide the whole bar rather than show a
    // permanently-broken sign-in form. Live filtering works via API key alone.
    document.getElementById("accountbar").style.display = "none";
  }
</script>

<div id="keybar">
  <label for="apikey">🔑 Anthropic API key (for live filtering):</label>
  <input id="apikey" type="password" placeholder="sk-ant-..." autocomplete="off" />
  <span id="keybar-status" style="color:#b7bdae;">not set</span>
  <button id="forget-key-btn" type="button" style="display:none; font-family: ui-sans-serif, system-ui; font-size: 11px; background: none; border: 1px solid #666; color: #ccc; border-radius: 3px; padding: 3px 8px; cursor: pointer;">Forget key</button>
  <button id="install-app-btn" type="button" style="display:none; font-family: ui-sans-serif, system-ui; font-size: 12px; font-weight: 600; background: #3C6E4F; border: none; color: #F7F4EC; border-radius: 3px; padding: 5px 12px; cursor: pointer;">📲 Install App</button>
  <span class="note">Saved only in this browser on this device — never sent anywhere but Anthropic's API.</span>
</div>

<div id="root"></div>

<script>
  var WISE_KEY_STORAGE = "wise_anthropic_api_key";

  // Read the key straight from the input at call time (callClaude does this directly),
  // so it works even if a password manager fills the field without firing "input".
  window.__getWiseApiKey__ = function () {
    var el = document.getElementById("apikey");
    return el ? el.value.trim() : "";
  };

  function refreshKeyStatus() {
    var status = document.getElementById("keybar-status");
    var forgetBtn = document.getElementById("forget-key-btn");
    var has = window.__getWiseApiKey__().length > 0;
    status.textContent = has ? "✓ key set" : "not set";
    status.style.color = has ? "#7fd08a" : "#b7bdae";
    forgetBtn.style.display = has ? "inline-block" : "none";
  }

  function saveKeyToStorage(key) {
    try {
      if (key) {
        localStorage.setItem(WISE_KEY_STORAGE, key);
      } else {
        localStorage.removeItem(WISE_KEY_STORAGE);
      }
    } catch (e) {
      // localStorage may be unavailable (e.g. private browsing); the key still works for this session
    }
  }

  var apikeyEl = document.getElementById("apikey");

  // Prefill from a previous visit, if this device has saved one before
  try {
    var savedKey = localStorage.getItem(WISE_KEY_STORAGE);
    if (savedKey) {
      apikeyEl.value = savedKey;
      window.__wiseApiKeyCache__ = savedKey;
    }
  } catch (e) {}

  ["input", "change", "keyup", "paste"].forEach(function (evt) {
    apikeyEl.addEventListener(evt, function () {
      // paste fires before the value is updated in some browsers, so re-check on a tick
      setTimeout(function () {
        refreshKeyStatus();
        saveKeyToStorage(window.__getWiseApiKey__());
      }, 0);
    });
  });

  document.getElementById("forget-key-btn").addEventListener("click", function () {
    apikeyEl.value = "";
    window.__wiseApiKeyCache__ = "";
    saveKeyToStorage("");
    refreshKeyStatus();
  });

  refreshKeyStatus();

  // --- Service worker: makes the app fully installable on Android Chrome
  // (not just a browser shortcut) and lets it reopen offline once visited.
  if ("serviceWorker" in navigator) {
    // Was a service worker already running this page before we started?
    // If not, this is a first install and no reload is needed.
    var hadController = !!navigator.serviceWorker.controller;
    var alreadyReloading = false;

    // When a NEW service worker takes control, reload once so the freshly
    // uploaded version of the app is what the user actually sees.
    navigator.serviceWorker.addEventListener("controllerchange", function () {
      if (!hadController || alreadyReloading) return;
      alreadyReloading = true;
      window.location.reload();
    });

    window.addEventListener("load", function () {
      navigator.serviceWorker
        .register("sw.js")
        .then(function (registration) {
          // Check for a newer version every time the app is opened.
          registration.update();
        })
        .catch(function () {
          // Fails harmlessly on browsers/origins that don't support it (e.g. no HTTPS)
        });
    });
  }

  // --- Custom "Install App" button, using the native browser install prompt
  // where supported (Chrome/Edge on desktop and Android). Browsers that don't
  // support this event (Firefox, Safari) simply never show the button, and
  // users there still use the manual Add to Home Screen / Install menu option.
  var deferredInstallPrompt = null;
  var installBtn = document.getElementById("install-app-btn");

  window.addEventListener("beforeinstallprompt", function (e) {
    e.preventDefault();
    deferredInstallPrompt = e;
    installBtn.style.display = "inline-block";
  });

  installBtn.addEventListener("click", function () {
    if (!deferredInstallPrompt) return;
    deferredInstallPrompt.prompt();
    deferredInstallPrompt.userChoice.finally(function () {
      deferredInstallPrompt = null;
      installBtn.style.display = "none";
    });
  });

  window.addEventListener("appinstalled", function () {
    installBtn.style.display = "none";
  });
</script>

CRITICAL — family-member discrimination. Some concepts belong to a tight family of near-neighbors that a generic definition accidentally covers all of. Example: "a push or pull that changes structural form" alone doesn't distinguish force from pressure or stress, since those also deform matter — the real difference is that force acts as a whole, while pressure and stress are force normalized by area. When a term has such neighbors, add the scoping word that excludes them (e.g., "as a whole," "at a point," "per unit area") rather than assuming the base definition already does.

CRITICAL — canonical terminology. Use the exact standard term-of-art a trained practitioner would use, not a near-synonym that sounds slightly off (e.g., write "state of motion," not "status of motion"). A definition can be structurally sound and still undercut the app's academic standard through one wrong word.

CRITICAL — self-synonym circularity. Rule 6 also catches defining a term using a grammatical cousin of itself. Example: "Speed measures how fast an object moves" defines speed using "fast" — the adjective form of speed itself. This looks non-circular because the words differ, but it's the same failure as restating the term. Check every content word in your final definition against the term: if any word is a synonym, adjective form, or colloquial stand-in for the term, replace it with the actual measurable relationship.

CRITICAL — ratio/rate completeness. If the term is a rate, ratio, or measured quantity (speed, density, pressure, momentum, acceleration, etc.), the definition must name BOTH quantities in the defining relationship, not just one. Example: "Speed measures how much distance an object covers" is incomplete — it drops time. The corrected form is "Speed is a scalar quantity that measures how much distance an object covers in a given time." Before finalizing a rate/ratio term, check that both halves of the relationship are named.

CRITICAL — concision and directness. Even a definition with the right facts can read as heavy if the phrasing is roundabout. Watch for repeated quantifiers ("all... all") and indirect verbs standing in for a direct relationship ("standards that measure laws" instead of "laws must meet the standard"). Example: "the binding standards that measure all other laws and government actions" tightens to "the standard all other laws must meet" — same fact, fewer words, easier to read aloud. Keep every discriminating fact, but state it as directly as possible.

3. Extract four fields: category, identity, mechanism, problem (the discrimination/circularity/condition weakness you found in the standard definition; if none, say "None").
4. Rewrite the definition as ONE plain sentence in the pattern "[Term] is the/a [core WHAT] ... that/exercised through/produced by [discriminating mechanism]." Use vocabulary a first-time student already knows — no jargon that itself needs defining. One sentence only.
5. Also classify the term's domain in a couple of words (e.g. "Structural Engineering", "Social Science", "Physics", "Biology"). If it applies to more than one, name the discipline whose usage your final sentence covers most completely.

If the term is not a real, recognizable academic word, phrase, or clause, respond with exactly: {"error":"not_found"}

Otherwise respond with ONLY minified JSON, no markdown fences, no preamble, in exactly this shape:
{"domain":"...","standard":"...","category":"...","identity":"...","mechanism":"...","problem":"...","definition":"..."}`;

function extractJson(rawText) {
  const match = rawText.match(/\{[\s\S]*\}/);
  const jsonText = match ? match[0] : rawText;
  return JSON.parse(jsonText);
}

async function callClaude(system, userContent) {
  let apiKey = (window.__getWiseApiKey__ ? window.__getWiseApiKey__() : "").trim();

  if (!apiKey && window.__wiseApiKeyCache__) {
    apiKey = window.__wiseApiKeyCache__;
  }

  if (!apiKey) {
    const entered = window.prompt(
      "Paste your Anthropic API key (from platform.claude.com, starts with sk-ant-...).\n\nIt's sent directly to Anthropic's API, and saved only in this browser on this device so you won't be asked again here."
    );
    if (entered && entered.trim()) {
      apiKey = entered.trim();
      window.__wiseApiKeyCache__ = apiKey;
      const field = document.getElementById("apikey");
      if (field) field.value = apiKey;
      if (typeof refreshKeyStatus === "function") refreshKeyStatus();
      if (typeof saveKeyToStorage === "function") saveKeyToStorage(apiKey);
    }
  }

  if (!apiKey) {
    throw new Error("An API key is required to use live filtering in this standalone file.");
  }

  const response = await fetch("https://api.anthropic.com/v1/messages", {
    method: "POST",
    headers: {
      "Content-Type": "application/json",
      "x-api-key": apiKey,
      "anthropic-version": "2023-06-01",
      "anthropic-dangerous-direct-browser-access": "true",
    },
    body: JSON.stringify({
      model: "claude-sonnet-4-6",
      max_tokens: 1500,
      system: system,
      messages: [{ role: "user", content: userContent }],
    }),
  });

  if (!response.ok) {
    const errText = await response.text();
    throw new Error(`API returned ${response.status}: ${errText.slice(0, 200)}`);
  }

  const data = await response.json();
  if (data.error) throw new Error(data.error.message || "API returned an error.");

  const rawText = (data.content || [])
    .map((block) => (block.type === "text" ? block.text : ""))
    .join("")
    .trim();

  if (!rawText) {
    throw new Error(
      data.stop_reason
        ? `The model stopped without returning text (reason: ${data.stop_reason}). Try again.`
        : "The model returned no text content to parse."
    );
  }

  try {
    return extractJson(rawText);
  } catch (parseErr) {
    if (data.stop_reason === "max_tokens") {
      throw new Error(
        `The response got cut off before finishing (hit the token limit). Raw reply: ${rawText.slice(0, 300)}`
      );
    }
    throw new Error(`Couldn't parse the model's response as JSON. Raw reply: ${rawText.slice(0, 300)}`);
  }
}

function slugify(term) {
  return term
    .toLowerCase()
    .trim()
    .replace(/[^a-z0-9]+/g, "-")
    .replace(/(^-|-$)/g, "");
}

function FieldRow({ label, value, tone }) {
  return (
    <div style={{ display: "flex", gap: 10, padding: "7px 0", borderBottom: `1px solid ${RULE}` }}>
      <div style={{ width: 92, flexShrink: 0, fontSize: 12, letterSpacing: "0.02em", color: tone || NAVY, fontWeight: 600, fontFamily: "ui-sans-serif, system-ui" }}>
        {label}
      </div>
      <div style={{ fontSize: 14, color: INK, lineHeight: 1.45, fontFamily: "ui-serif, Georgia, serif" }}>{value}</div>
    </div>
  );
}

function EntryCard({ entry, entries, expanded, onToggle }) {
  const pairEntry = entry.pair ? entries.find((e) => e.id === entry.pair) : null;
  return (
    <div style={{ borderBottom: `1px solid ${RULE}`, padding: "18px 0" }}>
      <button
        onClick={onToggle}
        style={{
          all: "unset",
          cursor: "pointer",
          display: "flex",
          justifyContent: "space-between",
          alignItems: "baseline",
          width: "100%",
        }}
      >
        <span style={{ fontFamily: "ui-serif, Georgia, serif", fontSize: 20, color: INK, fontWeight: 600 }}>
          {entry.term}
        </span>
        <span style={{ fontFamily: "ui-sans-serif, system-ui", fontSize: 11, color: CRIMSON, letterSpacing: "0.02em" }}>
          {expanded ? "hide breakdown" : "show breakdown"}
        </span>
      </button>
      <div style={{ fontFamily: "ui-sans-serif, system-ui", fontSize: 12, color: NAVY, marginTop: 2, marginBottom: 8 }}>
        {entry.domain}
        {pairEntry ? ` · paired with ${pairEntry.term}` : ""}
      </div>
      <p style={{ fontFamily: "ui-serif, Georgia, serif", fontSize: 16, color: INK, lineHeight: 1.6, margin: 0 }}>
        {entry.definition}
      </p>
      {expanded && (
        <div style={{ marginTop: 14, background: "#FDFCF7", border: `1px solid ${RULE}`, borderRadius: 3, padding: "10px 14px" }}>
          <FieldRow label="Category" value={entry.fields.category} />
          <FieldRow label="Identity" value={entry.fields.identity} />
          <FieldRow label="Mechanism" value={entry.fields.mechanism} />
          <FieldRow label="Resolved" value={entry.fields.problem} tone={CRIMSON} />
        </div>
      )}
    </div>
  );
}

function PipelineTab({ onSave }) {
  const [term, setTerm] = useState("");
  const [raw, setRaw] = useState("");
  const [result, setResult] = useState(null);
  const [loading, setLoading] = useState(false);
  const [error, setError] = useState("");

  const run = async () => {
    if (!term.trim() || !raw.trim()) {
      setError("Enter both a term and its standard definition.");
      return;
    }
    setError("");
    setLoading(true);
    setResult(null);
    try {
      const parsed = await callClaude(
        SYSTEM_PROMPT,
        `Term: ${term}\nStandard definition: ${raw}`
      );
      if (!parsed.definition) {
        throw new Error("Response parsed but had no 'definition' field. Raw: " + JSON.stringify(parsed).slice(0, 300));
      }
      setResult(parsed);
      if (onSave) {
        onSave({
          id: slugify(term),
          term,
          domain: "Custom",
          definition: parsed.definition,
          pair: null,
          fields: {
            category: parsed.category,
            identity: parsed.identity,
            mechanism: parsed.mechanism,
            problem: parsed.problem,
          },
        });
      }
    } catch (e) {
      setError(e.message || "The filter couldn't run that pass. Try again.");
    } finally {
      setLoading(false);
    }
  };

  return (
    <div>
      <p style={{ fontFamily: "ui-serif, Georgia, serif", fontSize: 15, color: INK, lineHeight: 1.6, marginBottom: 18 }}>
        Paste a term and the standard definition everyone already knows. The filter extracts what it's
        actually saying, checks it against the discrimination and circularity rules, and rebuilds it in
        plain, precise wording.
      </p>

      <label style={{ display: "block", fontFamily: "ui-sans-serif, system-ui", fontSize: 12, fontWeight: 600, color: NAVY, marginBottom: 4 }}>
        Term
      </label>
      <input
        value={term}
        onChange={(e) => setTerm(e.target.value)}
        placeholder="e.g. Inertia"
        style={{
          width: "100%",
          boxSizing: "border-box",
          fontFamily: "ui-serif, Georgia, serif",
          fontSize: 15,
          padding: "9px 10px",
          border: `1px solid ${RULE}`,
          borderRadius: 3,
          marginBottom: 14,
          background: "#FDFCF7",
          color: INK,
        }}
      />

      <label style={{ display: "block", fontFamily: "ui-sans-serif, system-ui", fontSize: 12, fontWeight: 600, color: NAVY, marginBottom: 4 }}>
        Standard definition
      </label>
      <textarea
        value={raw}
        onChange={(e) => setRaw(e.target.value)}
        placeholder="Paste the textbook definition here..."
        rows={4}
        style={{
          width: "100%",
          boxSizing: "border-box",
          fontFamily: "ui-serif, Georgia, serif",
          fontSize: 15,
          padding: "9px 10px",
          border: `1px solid ${RULE}`,
          borderRadius: 3,
          marginBottom: 14,
          background: "#FDFCF7",
          color: INK,
          resize: "vertical",
        }}
      />

      <button
        onClick={run}
        disabled={loading}
        style={{
          fontFamily: "ui-sans-serif, system-ui",
          fontSize: 13,
          fontWeight: 600,
          letterSpacing: "0.02em",
          color: PAPER,
          background: loading ? "#8a8f7a" : PINE,
          border: "none",
          borderRadius: 3,
          padding: "10px 18px",
          cursor: loading ? "default" : "pointer",
        }}
      >
        {loading ? "Running the filter…" : "Run through the filter"}
      </button>

      {error && (
        <p style={{ fontFamily: "ui-sans-serif, system-ui", fontSize: 13, color: CRIMSON, marginTop: 12 }}>
          {error}
        </p>
      )}

      {result && (
        <div style={{ marginTop: 22, borderTop: `2px solid ${INK}`, paddingTop: 16 }}>
          <div style={{ fontFamily: "ui-sans-serif, system-ui", fontSize: 11, fontWeight: 600, letterSpacing: "0.03em", color: CRIMSON, marginBottom: 8 }}>
            EXTRACTION
          </div>
          <FieldRow label="Category" value={result.category} />
          <FieldRow label="Identity" value={result.identity} />
          <FieldRow label="Mechanism" value={result.mechanism} />
          <FieldRow label="Flagged" value={result.problem} tone={CRIMSON} />

          <div style={{ fontFamily: "ui-sans-serif, system-ui", fontSize: 11, fontWeight: 600, letterSpacing: "0.03em", color: PINE, marginTop: 18, marginBottom: 8 }}>
            FILTERED DEFINITION
          </div>
          <p style={{ fontFamily: "ui-serif, Georgia, serif", fontSize: 17, color: INK, lineHeight: 1.6, margin: 0, fontStyle: "italic" }}>
            {result.definition}
          </p>
          <p style={{ fontFamily: "ui-sans-serif, system-ui", fontSize: 12, color: PINE, marginTop: 12 }}>
            Added to the Dictionary tab for this session.
          </p>
        </div>
      )}
    </div>
  );
}

function WiseApp() {
  const [tab, setTab] = useState("browse");
  const [entries, setEntries] = useState(SEED_ENTRIES);
  const [expandedId, setExpandedId] = useState(SEED_ENTRIES[0].id);
  const [query, setQuery] = useState("");
  const [lookupLoading, setLookupLoading] = useState(false);
  const [lookupError, setLookupError] = useState("");

  const normalize = (s) => s.toLowerCase().replace(/[-_\s]+/g, " ").trim();

  const filtered = entries.filter((e) => {
    const q = normalize(query);
    if (!q) return true;
    const termWords = normalize(e.term).split(" ");
    const domainWords = normalize(e.domain).split(" ");
    const qWords = q.split(" ");
    const containsAsSubstring =
      normalize(e.term).includes(q) || normalize(e.domain).includes(q);
    const allWordsPrefixMatch = qWords.every((qw) =>
      [...termWords, ...domainWords].some((w) => w.startsWith(qw))
    );
    return containsAsSubstring || allWordsPrefixMatch;
  });

  // Whether the query matches an existing TERM specifically (ignores domain labels like
  // "Physics" or "Law" so a query that only overlaps a domain name doesn't block lookup).
  const hasTermMatch = entries.some((e) => {
    const q = normalize(query);
    if (!q) return true;
    const termWords = normalize(e.term).split(" ");
    const qWords = q.split(" ");
    const containsAsSubstring = normalize(e.term).includes(q);
    const allWordsPrefixMatch = qWords.every((qw) => termWords.some((w) => w.startsWith(qw)));
    return containsAsSubstring || allWordsPrefixMatch;
  });

  const addEntry = (entry) => {
    setEntries((prev) => {
      const withoutDupe = prev.filter((e) => e.id !== entry.id);
      return [...withoutDupe, entry];
    });
    setExpandedId(entry.id);
  };

  const lookupAndFilter = async () => {
    const term = query.trim();
    if (!term) return;
    setLookupError("");
    setLookupLoading(true);
    try {
      const parsed = await callClaude(LOOKUP_SYSTEM_PROMPT, `Term: ${term}`);
      if (parsed.error === "not_found") {
        throw new Error(
          `"${term}" isn't recognized as an academic word, phrase, or clause. Check the spelling, or try "Filter a term" to supply your own standard definition.`
        );
      }
      if (!parsed.definition) {
        throw new Error("Response parsed but had no 'definition' field. Raw: " + JSON.stringify(parsed).slice(0, 300));
      }
      addEntry({
        id: slugify(term),
        term,
        domain: parsed.domain || "General",
        definition: parsed.definition,
        pair: null,
        fields: {
          category: parsed.category,
          identity: parsed.identity,
          mechanism: parsed.mechanism,
          problem: parsed.problem,
        },
      });
      setQuery("");
    } catch (e) {
      setLookupError(e.message || "Couldn't look that term up. Try again.");
    } finally {
      setLookupLoading(false);
    }
  };

  return (
    <div style={{ background: PAPER, minHeight: "100%", display: "flex", justifyContent: "center" }}>
      <div style={{ width: "100%", maxWidth: 480, padding: "22px 20px 60px" }}>
        {/* Header */}
        <div style={{ display: "flex", alignItems: "center", gap: 12, marginBottom: 4 }}>
          <img src={EMBLEM_SRC} alt="" style={{ width: 44, height: 44, flexShrink: 0 }} />
          <div>
            <div style={{ fontFamily: "ui-serif, Georgia, serif", fontSize: 24, fontWeight: 700, color: INK, letterSpacing: "0.01em" }}>
              WiseDefine
            </div>
            <div style={{ fontFamily: "ui-sans-serif, system-ui", fontSize: 11.5, color: NAVY }}>
              Definitions, reasoned to their what-ness
            </div>
          </div>
        </div>

        <div style={{ height: 1, background: INK, margin: "16px 0 14px" }} />

        {/* Tabs */}
        <div style={{ display: "flex", gap: 4, marginBottom: 18 }}>
          {[
            { id: "browse", label: "Dictionary" },
            { id: "pipeline", label: "Filter a term" },
          ].map((t) => (
            <button
              key={t.id}
              onClick={() => setTab(t.id)}
              style={{
                all: "unset",
                cursor: "pointer",
                fontFamily: "ui-sans-serif, system-ui",
                fontSize: 13,
                fontWeight: 600,
                padding: "7px 14px",
                borderRadius: 3,
                color: tab === t.id ? PAPER : INK,
                background: tab === t.id ? INK : "transparent",
                border: `1px solid ${INK}`,
              }}
            >
              {t.label}
            </button>
          ))}
        </div>

        {tab === "browse" ? (
          <div>
            <div style={{ display: "flex", gap: 6, marginBottom: 6 }}>
              <input
                value={query}
                onChange={(e) => setQuery(e.target.value)}
                onKeyDown={(e) => {
                  if (e.key === "Enter" && !hasTermMatch) lookupAndFilter();
                }}
                placeholder="Search, or type a new term to define..."
                style={{
                  flex: 1,
                  minWidth: 0,
                  boxSizing: "border-box",
                  fontFamily: "ui-serif, Georgia, serif",
                  fontSize: 15,
                  padding: "9px 10px",
                  border: `1px solid ${RULE}`,
                  borderRadius: 3,
                  background: "#FDFCF7",
                  color: INK,
                }}
              />
            </div>

            {!hasTermMatch && query.trim() && (
              <div style={{ marginTop: 8, marginBottom: 14 }}>
                <p style={{ fontFamily: "ui-sans-serif, system-ui", fontSize: 13, color: NAVY, marginBottom: 10 }}>
                  "{query}" isn't in the dictionary yet. WiseDefine can look up its standard definition and run it
                  through the filter automatically.
                </p>
                <button
                  onClick={lookupAndFilter}
                  disabled={lookupLoading}
                  style={{
                    fontFamily: "ui-sans-serif, system-ui",
                    fontSize: 13,
                    fontWeight: 600,
                    letterSpacing: "0.02em",
                    color: PAPER,
                    background: lookupLoading ? "#8a8f7a" : PINE,
                    border: "none",
                    borderRadius: 3,
                    padding: "10px 18px",
                    cursor: lookupLoading ? "default" : "pointer",
                  }}
                >
                  {lookupLoading ? "Looking up & filtering…" : `Look up & filter "${query.trim()}"`}
                </button>
                {lookupError && (
                  <p style={{ fontFamily: "ui-sans-serif, system-ui", fontSize: 13, color: CRIMSON, marginTop: 10 }}>
                    {lookupError}
                  </p>
                )}
                {filtered.length > 0 && (
                  <p style={{ fontFamily: "ui-sans-serif, system-ui", fontSize: 12, color: NAVY, marginTop: 10, fontStyle: "italic" }}>
                    Showing {filtered.length} existing entr{filtered.length === 1 ? "y" : "ies"} in a related field below.
                  </p>
                )}
              </div>
            )}

            {filtered.map((entry) => (
              <EntryCard
                key={entry.id}
                entry={entry}
                entries={entries}
                expanded={expandedId === entry.id}
                onToggle={() => setExpandedId(expandedId === entry.id ? null : entry.id)}
              />
            ))}
          </div>
        ) : (
          <PipelineTab onSave={addEntry} />
        )}
      </div>
    </div>
  );
}


const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<WiseApp />);
</script>

</body>
</html>
