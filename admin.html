<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex, nofollow" />
<title>WiseDefine — Admin</title>
<link rel="icon" href="favicon.ico" />
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root { --paper:#F7F4EC; --ink:#14161C; --navy:#0B1D45; --red:#A6363C; --green:#3C6E4F; --muted:#6b6b72; --line:#dcd8cc; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--paper); color:var(--ink); font-family:ui-sans-serif, system-ui, sans-serif; }
  header { background:var(--navy); color:#F7F4EC; padding:14px 18px; display:flex; align-items:center; gap:12px; }
  header img { width:34px; height:34px; }
  header h1 { font-family:ui-serif, Georgia, serif; font-size:20px; margin:0; }
  header .who { margin-left:auto; font-size:12px; opacity:.85; }
  main { max-width:980px; margin:0 auto; padding:18px; }
  h2 { font-family:ui-serif, Georgia, serif; font-size:19px; margin:26px 0 10px; }
  .cards { display:grid; grid-template-columns:repeat(auto-fill, minmax(150px, 1fr)); gap:10px; }
  .card { background:#fff; border:1px solid var(--line); border-radius:6px; padding:12px; }
  .card .n { font-size:24px; font-weight:700; }
  .card .l { font-size:12px; color:var(--muted); margin-top:2px; }
  .panel { background:#fff; border:1px solid var(--line); border-radius:6px; padding:14px; }
  table { width:100%; border-collapse:collapse; font-size:13px; }
  th, td { text-align:left; padding:6px 8px; border-bottom:1px solid #eee; }
  .bar { height:8px; background:var(--navy); border-radius:4px; display:inline-block; vertical-align:middle; margin-right:6px; }
  .bar.g { background:var(--green); } .bar.r { background:var(--red); }
  button { font-family:inherit; font-size:12px; font-weight:600; border:1px solid var(--line); background:#fff; border-radius:4px; padding:6px 10px; cursor:pointer; }
  button.primary { background:var(--green); color:#fff; border-color:var(--green); }
  button.danger { background:#fff; color:var(--red); border-color:var(--red); }
  button.dark { background:var(--ink); color:#fff; border-color:var(--ink); }
  select, input[type=text] { font-family:inherit; font-size:13px; padding:6px 8px; border:1px solid var(--line); border-radius:4px; background:#fff; }
  .row { display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
  .fb { border:1px solid var(--line); border-radius:6px; background:#fff; padding:12px; margin-bottom:10px; }
  .fb.pinned { border-left:4px solid #FFD54F; }
  .fb .meta { font-size:12px; color:var(--muted); margin-bottom:6px; }
  .fb .msg { white-space:pre-wrap; font-size:14px; margin-bottom:10px; }
  .tag { display:inline-block; font-size:11px; font-weight:700; padding:2px 7px; border-radius:10px; background:#eee; margin-right:4px; }
  .tag.new { background:#e3f0e7; color:var(--green); } .tag.filtered { background:#fde7d9; color:#b54708; }
  .tag.hidden { background:#eee; color:#777; } .tag.pinned { background:#fff4c2; color:#7a5a00; }
  .chip { display:inline-flex; align-items:center; gap:6px; background:#f1eee4; border-radius:14px; padding:4px 10px; font-size:12px; margin:0 6px 6px 0; }
  .chip button { padding:0 6px; border:none; background:none; color:var(--red); font-size:14px; }
  .notice { padding:30px; text-align:center; }
  .switch { display:flex; align-items:center; gap:10px; }
  .msgline { font-size:12px; min-height:16px; margin-top:6px; }
</style>
</head>
<body>
<header>
  <img src="icon-192.png" alt="" />
  <h1>WiseDefine — Admin</h1>
  <div class="who" id="who"></div>
</header>

<main id="app">
  <div class="notice" id="gate">Checking access…</div>
</main>

<script>
var SUPABASE_URL = "https://lzglfqvqoajjkvsmljjy.supabase.co";
var SUPABASE_ANON_KEY = "sb_publishable_s5eanQJElKHGjxakr_FeaA_xoDGa_xj";
var sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
var app = document.getElementById("app");

function esc(t) { return String(t == null ? "" : t).replace(/[&<>"']/g, function (c) { return { "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]; }); }
function fmt(ts) { try { return new Date(ts).toLocaleString(); } catch (e) { return ts; } }

var state = { statusFilter: "inbox", typeFilter: "all" };

async function start() {
  var s = await sb.auth.getSession();
  var user = s.data && s.data.session && s.data.session.user;
  if (!user) {
    app.innerHTML = '<div class="notice">Please sign in on <a href="./">WiseDefine</a> with your admin account, then come back to this page.</div>';
    return;
  }
  document.getElementById("who").textContent = user.email;
  var adm = await sb.rpc("is_admin");
  if (adm.error || adm.data !== true) {
    app.innerHTML = '<div class="notice">This page is private.</div>';
    return;
  }
  renderShell();
  loadStats(); loadSwitch(); loadFeedback(); loadWords(); loadBlocked();
}

function renderShell() {
  app.innerHTML =
    '<h2>Overview</h2><div class="cards" id="cards">Loading…</div>' +
    '<h2>Last 14 days</h2><div class="panel"><table id="daily"></table></div>' +
    '<h2>Feedback</h2>' +
    '<div class="panel" style="margin-bottom:12px"><div class="switch"><strong>Feedback button on the site:</strong> <span id="sw-state">…</span> <button id="sw-btn" class="dark">…</button></div><div class="msgline" id="sw-msg"></div></div>' +
    '<div class="row" style="margin-bottom:10px">' +
      '<select id="f-status"><option value="inbox">Inbox (new + held)</option><option value="filtered">Held by filter</option><option value="pinned">Pinned</option><option value="read">Read</option><option value="hidden">Hidden</option><option value="all">All</option></select>' +
      '<select id="f-type"><option value="all">All types</option><option value="suggestion">Suggestion</option><option value="problem">Problem / bug</option><option value="definition">Definition wrong/unclear</option><option value="praise">Praise</option><option value="other">Other</option></select>' +
      '<button id="f-refresh">Refresh</button>' +
    '</div>' +
    '<div id="fb-list">Loading…</div>' +
    '<h2>Filter words</h2><div class="panel"><p style="font-size:13px;margin-top:0">Feedback containing any of these words is held back for your review instead of going to the inbox.</p>' +
      '<div id="words"></div><div class="row"><input type="text" id="w-new" placeholder="add a word" maxlength="60" /><button class="primary" id="w-add">Add</button></div><div class="msgline" id="w-msg"></div></div>' +
    '<h2>Blocked senders</h2><div class="panel"><div id="blocked">Loading…</div></div>';

  document.getElementById("f-status").onchange = function () { state.statusFilter = this.value; loadFeedback(); };
  document.getElementById("f-type").onchange = function () { state.typeFilter = this.value; loadFeedback(); };
  document.getElementById("f-refresh").onclick = function () { loadStats(); loadFeedback(); };
  document.getElementById("w-add").onclick = addWord;
}

async function loadStats() {
  var r = await sb.rpc("admin_stats");
  if (r.error) { document.getElementById("cards").textContent = "Couldn't load statistics: " + r.error.message; return; }
  var d = r.data;
  var items = [
    ["Visits today", d.visits_today], ["Visits, 7 days", d.visits_7d], ["Visits, total", d.visits_total],
    ["Unique visitors, 7 days", d.visitors_7d], ["Unique visitors, total", d.visitors_total],
    ["Accounts, total", d.users_total], ["Sign-ups today", d.signups_today], ["Sign-ups, 7 days", d.signups_7d],
    ["Active accounts, 7 days", d.active_7d], ["Pro accounts", d.pro_users],
    ["Lookups today", d.lookups_today], ["Lookups, 7 days", d.lookups_7d], ["Lookups, total", d.lookups_total],
    ["Saved definitions", d.saved_definitions], ["Feedback to review", d.feedback_new]
  ];
  document.getElementById("cards").innerHTML = items.map(function (i) {
    return '<div class="card"><div class="n">' + esc(i[1]) + '</div><div class="l">' + esc(i[0]) + '</div></div>';
  }).join("");

  var days = d.daily || [];
  var max = Math.max(1, ...days.map(function (x) { return Math.max(x.visits, x.signups, x.lookups); }));
  document.getElementById("daily").innerHTML =
    '<tr><th>Day</th><th>Visits</th><th>Sign-ups</th><th>Lookups</th></tr>' +
    days.slice().reverse().map(function (x) {
      function cell(v, cls) { return '<span class="bar ' + cls + '" style="width:' + Math.round(80 * v / max) + 'px"></span>' + v; }
      return '<tr><td>' + esc(x.day) + '</td><td>' + cell(x.visits, "") + '</td><td>' + cell(x.signups, "g") + '</td><td>' + cell(x.lookups, "r") + '</td></tr>';
    }).join("");
}

async function loadSwitch() {
  var r = await sb.from("site_settings").select("feedback_enabled").eq("id", 1).maybeSingle();
  var on = !(r.data && r.data.feedback_enabled === false);
  document.getElementById("sw-state").textContent = on ? "ON" : "OFF";
  var btn = document.getElementById("sw-btn");
  btn.textContent = on ? "Turn off" : "Turn on";
  btn.onclick = async function () {
    var u = await sb.from("site_settings").update({ feedback_enabled: !on }).eq("id", 1);
    document.getElementById("sw-msg").textContent = u.error ? ("Couldn't change: " + u.error.message) : "Saved.";
    loadSwitch();
  };
}

async function loadFeedback() {
  var q = sb.from("feedback").select("*").order("pinned", { ascending: false }).order("created_at", { ascending: false }).limit(200);
  var f = state.statusFilter;
  if (f === "inbox") q = q.in("status", ["new", "filtered"]);
  else if (f === "pinned") q = q.eq("pinned", true);
  else if (f !== "all") q = q.eq("status", f);
  if (state.typeFilter !== "all") q = q.eq("type", state.typeFilter);
  var r = await q;
  var box = document.getElementById("fb-list");
  if (r.error) { box.textContent = "Couldn't load feedback: " + r.error.message; return; }
  if (!r.data.length) { box.innerHTML = '<div class="panel">Nothing here.</div>'; return; }
  box.innerHTML = r.data.map(function (x) {
    return '<div class="fb' + (x.pinned ? ' pinned' : '') + '">' +
      '<div class="meta">' + esc(fmt(x.created_at)) + ' · ' + esc(x.email || "visitor (no email)") + (x.user_id ? ' · signed in' : '') + '</div>' +
      '<div style="margin-bottom:6px"><span class="tag">' + esc(x.type) + '</span><span class="tag ' + esc(x.status) + '">' + esc(x.status) + '</span>' + (x.pinned ? '<span class="tag pinned">pinned</span>' : '') + '</div>' +
      '<div class="msg">' + esc(x.message) + '</div>' +
      '<div class="row">' +
        '<button data-a="pin" data-id="' + x.id + '">' + (x.pinned ? "Unpin" : "Pin") + '</button>' +
        (x.status !== "read" ? '<button data-a="read" data-id="' + x.id + '">' + (x.status === "filtered" ? "Approve (mark read)" : "Mark read") + '</button>' : '') +
        (x.status !== "hidden" ? '<button data-a="hide" data-id="' + x.id + '">Hide</button>' : '<button data-a="read" data-id="' + x.id + '">Unhide</button>') +
        ((x.user_id || x.email) ? '<button class="danger" data-a="block" data-id="' + x.id + '" data-uid="' + esc(x.user_id || "") + '" data-email="' + esc(x.email || "") + '">Block sender</button>' : '') +
        '<button class="danger" data-a="delete" data-id="' + x.id + '">Delete</button>' +
      '</div></div>';
  }).join("");
  box.querySelectorAll("button[data-a]").forEach(function (b) { b.onclick = function () { act(b, r.data); }; });
}

async function act(b, rows) {
  var id = Number(b.dataset.id), a = b.dataset.a, row = rows.find(function (x) { return x.id === id; });
  var res;
  if (a === "pin") res = await sb.from("feedback").update({ pinned: !row.pinned }).eq("id", id);
  if (a === "read") res = await sb.from("feedback").update({ status: "read" }).eq("id", id);
  if (a === "hide") res = await sb.from("feedback").update({ status: "hidden" }).eq("id", id);
  if (a === "delete") {
    if (!confirm("Delete this feedback permanently?")) return;
    res = await sb.from("feedback").delete().eq("id", id);
  }
  if (a === "block") {
    var who = b.dataset.email || "this signed-in user";
    if (!confirm("Block " + who + " from sending feedback?")) return;
    res = await sb.from("blocked_senders").insert({ user_id: b.dataset.uid || null, email: b.dataset.email || null, reason: "blocked from feedback #" + id });
    if (!res.error) await sb.from("feedback").update({ status: "hidden" }).eq("id", id);
    loadBlocked();
  }
  if (res && res.error) alert("Couldn't do that: " + res.error.message);
  loadFeedback(); loadStats();
}

async function loadWords() {
  var r = await sb.from("feedback_filter_words").select("word").order("word");
  var box = document.getElementById("words");
  if (r.error) { box.textContent = r.error.message; return; }
  box.innerHTML = r.data.length ? r.data.map(function (w) {
    return '<span class="chip">' + esc(w.word) + '<button title="Remove" data-w="' + esc(w.word) + '">×</button></span>';
  }).join("") : '<p style="font-size:13px;color:#6b6b72">No filter words yet.</p>';
  box.querySelectorAll("button[data-w]").forEach(function (b) {
    b.onclick = async function () { await sb.from("feedback_filter_words").delete().eq("word", b.dataset.w); loadWords(); };
  });
}

async function addWord() {
  var inp = document.getElementById("w-new"); var w = inp.value.trim().toLowerCase();
  if (!w) return;
  var r = await sb.from("feedback_filter_words").insert({ word: w });
  document.getElementById("w-msg").textContent = r.error ? ("Couldn't add: " + r.error.message) : "Added.";
  inp.value = ""; loadWords();
}

async function loadBlocked() {
  var r = await sb.from("blocked_senders").select("*").order("created_at", { ascending: false });
  var box = document.getElementById("blocked");
  if (r.error) { box.textContent = r.error.message; return; }
  if (!r.data.length) { box.innerHTML = '<p style="font-size:13px;color:#6b6b72;margin:0">Nobody is blocked.</p>'; return; }
  box.innerHTML = '<table><tr><th>Who</th><th>Since</th><th></th></tr>' + r.data.map(function (x) {
    return '<tr><td>' + esc(x.email || ("user " + String(x.user_id).slice(0, 8) + "…")) + '</td><td>' + esc(fmt(x.created_at)) + '</td><td><button data-u="' + x.id + '">Unblock</button></td></tr>';
  }).join("") + '</table>';
  box.querySelectorAll("button[data-u]").forEach(function (b) {
    b.onclick = async function () { await sb.from("blocked_senders").delete().eq("id", Number(b.dataset.u)); loadBlocked(); };
  });
}

start();
</script>
</body>
</html>
