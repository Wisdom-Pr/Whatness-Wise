<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex, nofollow" />
<title>WiseDefine — Admin</title>
<link rel="icon" href="favicon.ico" />
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root { --paper:#F7F4EC; --ink:#14161C; --navy:#0B1D45; --red:#A6363C; --green:#3C6E4F; --muted:#6b6b72; --line:#dcd8cc; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--paper); color:var(--ink); font-family:ui-sans-serif, system-ui, sans-serif; }
  header { background:var(--navy); color:#F7F4EC; padding:14px 18px; display:flex; align-items:center; gap:12px; }
  header img { width:34px; height:34px; }
  header h1 { font-family:ui-serif, Georgia, serif; font-size:20px; margin:0; }
  header .who { margin-left:auto; font-size:12px; opacity:.85; }
  main { max-width:980px; margin:0 auto; padding:18px; }
  h2 { font-family:ui-serif, Georgia, serif; font-size:19px; margin:26px 0 10px; }
  .cards { display:grid; grid-template-columns:repeat(auto-fill, minmax(150px, 1fr)); gap:10px; }
  .card { background:#fff; border:1px solid var(--line); border-radius:6px; padding:12px; }
  .card .n { font-size:24px; font-weight:700; }
  .card .l { font-size:12px; color:var(--muted); margin-top:2px; }
  .panel { background:#fff; border:1px solid var(--line); border-radius:6px; padding:14px; }
  table { width:100%; border-collapse:collapse; font-size:13px; }
  th, td { text-align:left; padding:6px 8px; border-bottom:1px solid #eee; }
  .bar { height:8px; background:var(--navy); border-radius:4px; display:inline-block; vertical-align:middle; margin-right:6px; }
  .bar.g { background:var(--green); } .bar.r { background:var(--red); }
  button { font-family:inherit; font-size:12px; font-weight:600; border:1px solid var(--line); background:#fff; border-radius:4px; padding:6px 10px; cursor:pointer; }
  button.primary { background:var(--green); color:#fff; border-color:var(--green); }
  button.danger { background:#fff; color:var(--red); border-color:var(--red); }
  button.dark { background:var(--ink); color:#fff; border-color:var(--ink); }
  select, input[type=text] { font-family:inherit; font-size:13px; padding:6px 8px; border:1px solid var(--line); border-radius:4px; background:#fff; }
  .row { display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
  .fb { border:1px solid var(--line); border-radius:6px; background:#fff; padding:12px; margin-bottom:10px; }
  .fb.pinned { border-left:4px solid #FFD54F; }
  .fb .meta { font-size:12px; color:var(--muted); margin-bottom:6px; }
  .fb .msg { white-space:pre-wrap; font-size:14px; margin-bottom:10px; }
  .tag { display:inline-block; font-size:11px; font-weight:700; padding:2px 7px; border-radius:10px; background:#eee; margin-right:4px; }
  .tag.new { background:#e3f0e7; color:var(--green); } .tag.filtered { background:#fde7d9; color:#b54708; }
  .tag.hidden { background:#eee; color:#777; } .tag.pinned { background:#fff4c2; color:#7a5a00; }
  .chip { display:inline-flex; align-items:center; gap:6px; background:#f1eee4; border-radius:14px; padding:4px 10px; font-size:12px; margin:0 6px 6px 0; }
  .chip button { padding:0 6px; border:none; background:none; color:var(--red); font-size:14px; }
  .notice { padding:30px; text-align:center; }
  .switch { display:flex; align-items:center; gap:10px; }
  .msgline { font-size:12px; min-height:16px; margin-top:6px; }
</style>
</head>
<body>
<header>
  <img src="icon-192.png" alt="" />
  <h1>WiseDefine — Admin</h1>
  <div class="who" id="who"></div>
  <button id="signout" style="display:none;margin-left:10px">Sign out</button>
</header>

<main id="app">
  <div class="notice" id="gate">Checking access…</div>
</main>

<script>
var SUPABASE_URL = "https://lzglfqvqoajjkvsmljjy.supabase.co";
var SUPABASE_ANON_KEY = "sb_publishable_s5eanQJElKHGjxakr_FeaA_xoDGa_xj";
var sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
var app = document.getElementById("app");

function esc(t) { return String(t == null ? "" : t).replace(/[&<>"']/g, function (c) { return { "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]; }); }
function fmt(ts) { try { return new Date(ts).toLocaleString(); } catch (e) { return ts; } }

var state = { statusFilter: "inbox", typeFilter: "all" };

async function start() {
  var s = await sb.auth.getSession();
  var user = s.data && s.data.session && s.data.session.user;
  if (!user) {
    app.innerHTML = '<div class="notice">Please sign in on <a href="./">WiseDefine</a> with your admin account, then come back to this page.</div>';
    return;
  }
  document.getElementById("who").textContent = user.email;
  var so = document.getElementById("signout");
  so.style.display = "inline-block";
  so.onclick = async function () { await sb.auth.signOut(); location.href = "./"; };
  var adm = await sb.rpc("is_admin");
  if (adm.error || adm.data !== true) {
    app.innerHTML = '<div class="notice">This page is private. You are signed in as <strong>' + esc(user.email) + '</strong>, which is not an admin account.<br><br><button class="dark" id="switch-acc">Sign out and switch account</button></div>';
    document.getElementById("switch-acc").onclick = async function () { await sb.auth.signOut(); location.href = "./"; };
    return;
  }
  renderShell();
  loadStats(); loadRequests(); loadAccounts(); loadDefs(); loadSwitch(); loadFeedback(); loadWords(); loadBlocked(); loadBatch();
}

function renderShell() {
  app.innerHTML =
    '<h2>Overview</h2><div class="cards" id="cards">Loading…</div>' +
    '<h2>Last 14 days</h2><div class="panel"><table id="daily"></table></div>' +
    '<h2>Grant or extend Pro</h2><div class="panel">' +
      '<p style="font-size:13px;margin-top:0">For people who paid you another way (TeleBirr, cash, institution…). Time is added after any Pro time they already have. Lifetime accounts are never shortened.</p>' +
      '<div class="row" style="margin-bottom:8px"><input type="text" id="g-email" placeholder="account email" style="min-width:230px" />' +
      '<select id="g-kind"><option value="1">1 month</option><option value="12">12 months</option><option value="m">Custom months</option><option value="d">Until a date</option><option value="life">Lifetime</option></select>' +
      '<input type="text" id="g-extra" placeholder="" style="display:none;width:130px" />' +
      '<button class="primary" id="g-go">Grant</button><button class="danger" id="g-revoke">Set back to Free</button></div>' +
      '<div class="msgline" id="g-msg"></div></div>' +
    '<h2>Flexible payment requests</h2><div class="panel"><div class="row" style="margin-bottom:8px"><select id="pr-filter"><option value="open">Open (new + contacted)</option><option value="granted">Granted</option><option value="declined">Declined</option><option value="all">All</option></select></div><div id="pr-list">Loading…</div></div>' +
    '<h2>Accounts</h2><div class="panel"><div class="row" style="margin-bottom:8px"><input type="text" id="acc-q" placeholder="search email" /><span id="acc-count" style="font-size:12px;color:#6b6b72"></span></div><div style="overflow-x:auto"><table id="acc"></table></div></div>' +
    '<h2>Saved definitions</h2><div class="panel"><div class="row" style="margin-bottom:8px"><input type="text" id="def-q" placeholder="search text" /><span id="def-count" style="font-size:12px;color:#6b6b72"></span></div><div id="defs">Loading…</div></div>' +
    batchSectionHtml() +
    '<h2>Feedback</h2>' +
    '<div class="panel" style="margin-bottom:12px"><div class="switch"><strong>Feedback button on the site:</strong> <span id="sw-state">…</span> <button id="sw-btn" class="dark">…</button></div><div class="msgline" id="sw-msg"></div></div>' +
    '<div class="row" style="margin-bottom:10px">' +
      '<select id="f-status"><option value="inbox">Inbox (new + held)</option><option value="filtered">Held by filter</option><option value="pinned">Pinned</option><option value="read">Read</option><option value="hidden">Hidden</option><option value="all">All</option></select>' +
      '<select id="f-type"><option value="all">All types</option><option value="suggestion">Suggestion</option><option value="problem">Problem / bug</option><option value="definition">Definition wrong/unclear</option><option value="praise">Praise</option><option value="other">Other</option></select>' +
      '<button id="f-refresh">Refresh</button>' +
    '</div>' +
    '<div id="fb-list">Loading…</div>' +
    '<h2>Filter words</h2><div class="panel"><p style="font-size:13px;margin-top:0">Feedback containing any of these words is held back for your review instead of going to the inbox.</p>' +
      '<div id="words"></div><div class="row"><input type="text" id="w-new" placeholder="add a word" maxlength="60" /><button class="primary" id="w-add">Add</button></div><div class="msgline" id="w-msg"></div></div>' +
    '<h2>Blocked senders</h2><div class="panel"><div id="blocked">Loading…</div></div>';

  document.getElementById("f-status").onchange = function () { state.statusFilter = this.value; loadFeedback(); };
  document.getElementById("f-type").onchange = function () { state.typeFilter = this.value; loadFeedback(); };
  document.getElementById("f-refresh").onclick = function () { loadStats(); loadAccounts(); loadDefs(); loadFeedback(); };
  document.getElementById("w-add").onclick = addWord;
  document.getElementById("acc-q").oninput = renderAccounts;
  document.getElementById("g-kind").onchange = function () {
    var x = document.getElementById("g-extra");
    x.style.display = (this.value === "m" || this.value === "d") ? "inline-block" : "none";
    x.placeholder = this.value === "m" ? "months, e.g. 36" : "YYYY-MM-DD";
  };
  document.getElementById("g-go").onclick = grantPro;
  document.getElementById("g-revoke").onclick = revokePro;
  document.getElementById("pr-filter").onchange = loadRequests;
  document.getElementById("def-q").oninput = renderDefs;
  wireBatch();
}

async function loadStats() {
  var r = await sb.rpc("admin_stats");
  if (r.error) { document.getElementById("cards").textContent = "Couldn't load statistics: " + r.error.message; return; }
  var d = r.data;
  var items = [
    ["Visits today", d.visits_today], ["Visits, 7 days", d.visits_7d], ["Visits, total", d.visits_total],
    ["Unique visitors, 7 days", d.visitors_7d], ["Unique visitors, total", d.visitors_total],
    ["Accounts, total", d.users_total], ["Sign-ups today", d.signups_today], ["Sign-ups, 7 days", d.signups_7d],
    ["Active accounts, 7 days", d.active_7d], ["Pro accounts", d.pro_users],
    ["Lookups today", d.lookups_today], ["Lookups, 7 days", d.lookups_7d], ["Lookups, total", d.lookups_total],
    ["Saved definitions", d.saved_definitions], ["Feedback to review", d.feedback_new]
  ];
  document.getElementById("cards").innerHTML = items.map(function (i) {
    return '<div class="card"><div class="n">' + esc(i[1]) + '</div><div class="l">' + esc(i[0]) + '</div></div>';
  }).join("");

  var days = d.daily || [];
  var max = Math.max(1, ...days.map(function (x) { return Math.max(x.visits, x.signups, x.lookups); }));
  document.getElementById("daily").innerHTML =
    '<tr><th>Day</th><th>Visits</th><th>Sign-ups</th><th>Lookups</th></tr>' +
    days.slice().reverse().map(function (x) {
      function cell(v, cls) { return '<span class="bar ' + cls + '" style="width:' + Math.round(80 * v / max) + 'px"></span>' + v; }
      return '<tr><td>' + esc(x.day) + '</td><td>' + cell(x.visits, "") + '</td><td>' + cell(x.signups, "g") + '</td><td>' + cell(x.lookups, "r") + '</td></tr>';
    }).join("");
}

var accounts = [], defs = [];
function fmtDate(ts) { if (!ts) return "—"; try { return new Date(ts).toLocaleDateString(); } catch (e) { return ts; } }

async function loadAccounts() {
  var r = await sb.rpc("admin_accounts");
  if (r.error) { document.getElementById("acc").innerHTML = "<tr><td>Couldn't load accounts: " + esc(r.error.message) + "</td></tr>"; return; }
  accounts = r.data || []; renderAccounts();
}
function renderAccounts() {
  var q = (document.getElementById("acc-q").value || "").toLowerCase();
  var rows = accounts.filter(function (a) { return !q || String(a.email || "").toLowerCase().indexOf(q) !== -1; });
  document.getElementById("acc-count").textContent = rows.length + " of " + accounts.length;
  var today = new Date().toLocaleDateString("en-CA", { timeZone: "Africa/Addis_Ababa" });
  document.getElementById("acc").innerHTML =
    '<tr><th>Email</th><th>Plan</th><th>Signed up</th><th>Last sign-in</th><th>Lookups today</th></tr>' +
    rows.map(function (a) {
      var plan = a.plan || "free";
      if (plan === "pro") plan = a.pro_until ? ("pro until " + a.pro_until) : "pro (lifetime)";
      var used = (a.lookup_date === today) ? (a.lookups_today || 0) : 0;
      return '<tr><td>' + esc(a.email) + (a.is_admin ? ' <span class="tag pinned">admin</span>' : '') + '</td><td>' + esc(plan) + '</td><td>' + esc(fmtDate(a.created_at)) + '</td><td>' + esc(fmt(a.last_sign_in_at || "")) + '</td><td>' + used + '</td></tr>';
    }).join("");
}

async function loadDefs() {
  var r = await sb.rpc("admin_saved_definitions");
  if (r.error) { document.getElementById("defs").textContent = "Couldn't load saved definitions: " + r.error.message; return; }
  defs = r.data || []; renderDefs();
}
function renderDefs() {
  var q = (document.getElementById("def-q").value || "").toLowerCase();
  var rows = defs.filter(function (d) { return !q || String(d.definition || "").toLowerCase().indexOf(q) !== -1; });
  document.getElementById("def-count").textContent = rows.length + " of " + defs.length;
  var box = document.getElementById("defs");
  if (!rows.length) { box.innerHTML = '<p style="font-size:13px;color:#6b6b72;margin:0">Nothing here.</p>'; return; }
  box.innerHTML = rows.map(function (d, i) {
    var text = String(d.definition || "");
    var first = text.split("\n").find(function (l) { return l.trim(); }) || "(empty)";
    return '<details class="fb" style="padding:10px"><summary style="cursor:pointer;font-size:14px"><strong>' + esc(first.replace(/[#*_`]/g, "").slice(0, 120)) + '</strong>' +
      '<div class="meta" style="margin:4px 0 0">' + esc(fmt(d.created_at)) + ' · ' + esc(d.model || "") + ' · reused ' + (d.hits || 0) + ' time' + (d.hits === 1 ? '' : 's') + '</div></summary>' +
      '<div class="msg" style="margin-top:10px">' + esc(text) + '</div>' +
      '<button class="danger" data-k="' + esc(d.key) + '">Delete this saved definition</button></details>';
  }).join("");
  box.querySelectorAll("button[data-k]").forEach(function (b) {
    b.onclick = async function () {
      if (!confirm("Delete this saved definition? The next lookup of this term will create a fresh one.")) return;
      var r = await sb.rpc("admin_delete_definition", { p_key: b.dataset.k });
      if (r.error) alert("Couldn't delete: " + r.error.message);
      loadDefs(); loadStats();
    };
  });
}

async function grantPro() {
  var email = document.getElementById("g-email").value.trim();
  var kind = document.getElementById("g-kind").value;
  var extra = document.getElementById("g-extra").value.trim();
  var msg = document.getElementById("g-msg");
  if (!email) { msg.textContent = "Enter the account email."; return; }
  var args = { p_email: email, p_months: null, p_until: null, p_lifetime: false };
  if (kind === "1" || kind === "12") args.p_months = Number(kind);
  else if (kind === "m") { args.p_months = parseInt(extra, 10); if (!(args.p_months > 0)) { msg.textContent = "Enter a number of months."; return; } }
  else if (kind === "d") { if (!/^\d{4}-\d{2}-\d{2}$/.test(extra)) { msg.textContent = "Enter the date as YYYY-MM-DD."; return; } args.p_until = extra; }
  else if (kind === "life") { if (!confirm("Give " + email + " lifetime Pro?")) return; args.p_lifetime = true; }
  var r = await sb.rpc("admin_grant_pro", args);
  msg.textContent = r.error ? ("Couldn't grant: " + r.error.message) : (r.data && r.data.message);
  if (!r.error && r.data && r.data.ok && window.__pendingRequestId) {
    await sb.from("payment_requests").update({ status: "granted" }).eq("id", window.__pendingRequestId);
    window.__pendingRequestId = null; loadRequests();
  }
  loadAccounts(); loadStats();
}

async function revokePro() {
  var email = document.getElementById("g-email").value.trim();
  var msg = document.getElementById("g-msg");
  if (!email) { msg.textContent = "Enter the account email."; return; }
  if (!confirm("Set " + email + " back to Free?")) return;
  var r = await sb.rpc("admin_revoke_pro", { p_email: email });
  msg.textContent = r.error ? ("Couldn't change: " + r.error.message) : (r.data && r.data.message);
  loadAccounts(); loadStats();
}

var METHOD = { telebirr: "TeleBirr", cbe_birr: "CBE Birr", bank: "Bank", cash: "Cash", institution: "Institution", other: "Other" };
var WANT = { month: "1 month", year: "12 months", custom: "different period", institution: "institutional deal" };

async function loadRequests() {
  var f = document.getElementById("pr-filter").value;
  var q = sb.from("payment_requests").select("*").order("created_at", { ascending: false }).limit(200);
  if (f === "open") q = q.in("status", ["new", "contacted"]);
  else if (f !== "all") q = q.eq("status", f);
  var r = await q;
  var box = document.getElementById("pr-list");
  if (r.error) { box.textContent = "Couldn't load requests: " + r.error.message; return; }
  if (!r.data.length) { box.innerHTML = '<p style="font-size:13px;color:#6b6b72;margin:0">No requests here.</p>'; return; }
  box.innerHTML = r.data.map(function (x) {
    return '<div class="fb"><div class="meta">' + esc(fmt(x.created_at)) + ' · ' + esc(x.email || "") + '</div>' +
      '<div style="margin-bottom:6px"><span class="tag">' + esc(METHOD[x.method] || x.method) + '</span><span class="tag">' + esc(WANT[x.plan_wanted] || x.plan_wanted) + '</span><span class="tag ' + (x.status === "new" ? "new" : "") + '">' + esc(x.status) + '</span></div>' +
      '<div class="msg"><strong>' + esc(x.name || "(no name)") + '</strong> — ' + esc(x.contact || "") + (x.message ? "\n" + esc(x.message) : "") + '</div>' +
      '<div class="row">' +
        '<button data-p="contacted" data-id="' + x.id + '">Mark contacted</button>' +
        '<button class="primary" data-g="' + esc(x.email || "") + '" data-id="' + x.id + '">Grant Pro…</button>' +
        '<button data-p="declined" data-id="' + x.id + '">Decline</button>' +
        '<button class="danger" data-del="' + x.id + '">Delete</button>' +
      '</div></div>';
  }).join("");
  box.querySelectorAll("button[data-p]").forEach(function (b) {
    b.onclick = async function () { await sb.from("payment_requests").update({ status: b.dataset.p }).eq("id", Number(b.dataset.id)); loadRequests(); };
  });
  box.querySelectorAll("button[data-del]").forEach(function (b) {
    b.onclick = async function () { if (!confirm("Delete this request?")) return; await sb.from("payment_requests").delete().eq("id", Number(b.dataset.del)); loadRequests(); };
  });
  box.querySelectorAll("button[data-g]").forEach(function (b) {
    b.onclick = function () {
      document.getElementById("g-email").value = b.dataset.g;
      document.getElementById("g-msg").textContent = "Choose the period above and click Grant. Then mark the request as granted.";
      window.__pendingRequestId = Number(b.dataset.id);
      document.getElementById("g-email").scrollIntoView({ behavior: "smooth", block: "center" });
    };
  });
}

async function loadSwitch() {
  var r = await sb.from("site_settings").select("feedback_enabled").eq("id", 1).maybeSingle();
  var on = !(r.data && r.data.feedback_enabled === false);
  document.getElementById("sw-state").textContent = on ? "ON" : "OFF";
  var btn = document.getElementById("sw-btn");
  btn.textContent = on ? "Turn off" : "Turn on";
  btn.onclick = async function () {
    var u = await sb.from("site_settings").update({ feedback_enabled: !on }).eq("id", 1);
    document.getElementById("sw-msg").textContent = u.error ? ("Couldn't change: " + u.error.message) : "Saved.";
    loadSwitch();
  };
}

async function loadFeedback() {
  var q = sb.from("feedback").select("*").order("pinned", { ascending: false }).order("created_at", { ascending: false }).limit(200);
  var f = state.statusFilter;
  if (f === "inbox") q = q.in("status", ["new", "filtered"]);
  else if (f === "pinned") q = q.eq("pinned", true);
  else if (f !== "all") q = q.eq("status", f);
  if (state.typeFilter !== "all") q = q.eq("type", state.typeFilter);
  var r = await q;
  var box = document.getElementById("fb-list");
  if (r.error) { box.textContent = "Couldn't load feedback: " + r.error.message; return; }
  if (!r.data.length) { box.innerHTML = '<div class="panel">Nothing here.</div>'; return; }
  box.innerHTML = r.data.map(function (x) {
    return '<div class="fb' + (x.pinned ? ' pinned' : '') + '">' +
      '<div class="meta">' + esc(fmt(x.created_at)) + ' · ' + esc(x.email || "visitor (no email)") + (x.user_id ? ' · signed in' : '') + '</div>' +
      '<div style="margin-bottom:6px"><span class="tag">' + esc(x.type) + '</span><span class="tag ' + esc(x.status) + '">' + esc(x.status) + '</span>' + (x.pinned ? '<span class="tag pinned">pinned</span>' : '') + '</div>' +
      '<div class="msg">' + esc(x.message) + '</div>' +
      '<div class="row">' +
        '<button data-a="pin" data-id="' + x.id + '">' + (x.pinned ? "Unpin" : "Pin") + '</button>' +
        (x.status !== "read" ? '<button data-a="read" data-id="' + x.id + '">' + (x.status === "filtered" ? "Approve (mark read)" : "Mark read") + '</button>' : '') +
        (x.status !== "hidden" ? '<button data-a="hide" data-id="' + x.id + '">Hide</button>' : '<button data-a="read" data-id="' + x.id + '">Unhide</button>') +
        ((x.user_id || x.email) ? '<button class="danger" data-a="block" data-id="' + x.id + '" data-uid="' + esc(x.user_id || "") + '" data-email="' + esc(x.email || "") + '">Block sender</button>' : '') +
        '<button class="danger" data-a="delete" data-id="' + x.id + '">Delete</button>' +
      '</div></div>';
  }).join("");
  box.querySelectorAll("button[data-a]").forEach(function (b) { b.onclick = function () { act(b, r.data); }; });
}

async function act(b, rows) {
  var id = Number(b.dataset.id), a = b.dataset.a, row = rows.find(function (x) { return x.id === id; });
  var res;
  if (a === "pin") res = await sb.from("feedback").update({ pinned: !row.pinned }).eq("id", id);
  if (a === "read") res = await sb.from("feedback").update({ status: "read" }).eq("id", id);
  if (a === "hide") res = await sb.from("feedback").update({ status: "hidden" }).eq("id", id);
  if (a === "delete") {
    if (!confirm("Delete this feedback permanently?")) return;
    res = await sb.from("feedback").delete().eq("id", id);
  }
  if (a === "block") {
    var who = b.dataset.email || "this signed-in user";
    if (!confirm("Block " + who + " from sending feedback?")) return;
    res = await sb.from("blocked_senders").insert({ user_id: b.dataset.uid || null, email: b.dataset.email || null, reason: "blocked from feedback #" + id });
    if (!res.error) await sb.from("feedback").update({ status: "hidden" }).eq("id", id);
    loadBlocked();
  }
  if (res && res.error) alert("Couldn't do that: " + res.error.message);
  loadFeedback(); loadStats();
}

async function loadWords() {
  var r = await sb.from("feedback_filter_words").select("word").order("word");
  var box = document.getElementById("words");
  if (r.error) { box.textContent = r.error.message; return; }
  box.innerHTML = r.data.length ? r.data.map(function (w) {
    return '<span class="chip">' + esc(w.word) + '<button title="Remove" data-w="' + esc(w.word) + '">×</button></span>';
  }).join("") : '<p style="font-size:13px;color:#6b6b72">No filter words yet.</p>';
  box.querySelectorAll("button[data-w]").forEach(function (b) {
    b.onclick = async function () { await sb.from("feedback_filter_words").delete().eq("word", b.dataset.w); loadWords(); };
  });
}

async function addWord() {
  var inp = document.getElementById("w-new"); var w = inp.value.trim().toLowerCase();
  if (!w) return;
  var r = await sb.from("feedback_filter_words").insert({ word: w });
  document.getElementById("w-msg").textContent = r.error ? ("Couldn't add: " + r.error.message) : "Added.";
  inp.value = ""; loadWords();
}

async function loadBlocked() {
  var r = await sb.from("blocked_senders").select("*").order("created_at", { ascending: false });
  var box = document.getElementById("blocked");
  if (r.error) { box.textContent = r.error.message; return; }
  if (!r.data.length) { box.innerHTML = '<p style="font-size:13px;color:#6b6b72;margin:0">Nobody is blocked.</p>'; return; }
  box.innerHTML = '<table><tr><th>Who</th><th>Since</th><th></th></tr>' + r.data.map(function (x) {
    return '<tr><td>' + esc(x.email || ("user " + String(x.user_id).slice(0, 8) + "…")) + '</td><td>' + esc(fmt(x.created_at)) + '</td><td><button data-u="' + x.id + '">Unblock</button></td></tr>';
  }).join("") + '</table>';
  box.querySelectorAll("button[data-u]").forEach(function (b) {
    b.onclick = async function () { await sb.from("blocked_senders").delete().eq("id", Number(b.dataset.u)); loadBlocked(); };
  });
}

ith exactly: {\"error\":\"not_found\"}\n\nOtherwise respond with ONLY minified JSON, no markdown fences, no preamble, in exactly this shape:\n{\"domain\":\"...\",\"standard\":\"...\",\"category\":\"...\",\"identity\":\"...\",\"mechanism\":\"...\",\"problem\":\"...\",\"definition\":\"...\"}";

      '<select id="b-filter"><option value="done">To review</option><option value="approved">Approved</option><option value="rejected">Rejected (original kept)</option><option value="not_found">Not recognised</option><option value="failed">Failed</option><option value="pending">Not yet defined</option><option value="all">All</option></select>' +
      '<select id="b-coll"><option value="all">All collections</option><option value="stem">STEM</option><option value="bal">Business, Administration and Law</option><option value="hw">Health and Welfare</option></select>' +
      '<input type="text" id="b-q" placeholder="search term" />' +
      '<button id="b-approve-all">Approve all shown “to review”</button>' +
      '<span id="b-count" style="font-size:12px;color:#6b6b72"></span>' +
    '</div>' +
    '<div id="b-list"></div>' +
    '<h3 style="font-size:15px;margin:16px 0 8px">Export</h3>' +
    '<p style="font-size:13px;margin-top:0">Approved terms get WiseDefine\'s new definition and fields; every other term keeps its current text (new-round terms without an approved definition are left out). Ids, pages and links never change.</p>' +
    '<div class="row"><button class="dark" id="b-exp-stem">Download stem.json</button><button class="dark" id="b-exp-bal">Download bal.json</button><button class="dark" id="b-exp-hw">Download hw.json</button>' +
      '<label style="font-size:12px"><input type="checkbox" id="b-exp-done" /> Also include “to review” terms</label></div>' +
    '<div class="msgline" id="b-exp-msg"></div>' +
  '</div>';
}

function wireBatch() {
  bel("b-start").onclick = batchStart;
  bel("b-pause").onclick = batchPause;
  bel("b-filter").onchange = function () { B.shown = 40; renderBatchList(); };
  bel("b-coll").onchange = function () { B.shown = 40; renderBatchList(); };
  bel("b-q").oninput = function () { B.shown = 40; renderBatchList(); };
  bel("b-approve-all").onclick = approveAllShown;
  bel("b-exp-stem").onclick = function () { exportColl("stem"); };
  bel("b-exp-bal").onclick = function () { exportColl("bal"); };
  bel("b-exp-hw").onclick = function () { exportColl("hw"); };
}

async function fetchLibFile(url) {
  var r = await fetch(url + "?v=" + Date.now(), { cache: "no-store" });
  if (!r.ok) throw new Error(url + " " + r.status);
  return r.json();
}

async function loadBatch() {
  for (var i = 0; i < BCOLLS.length; i++) {
    var c = BCOLLS[i];
    for (var j = 0; j < c.files.length && !B.lib[c.key]; j++) {
      try { B.lib[c.key] = await fetchLibFile(c.files[j]); } catch (e) {}
    }
    if (c.list) {
      // Lay any published definitions over the full term list.
      var have = {};
      ((B.lib[c.key] && B.lib[c.key].entries) || []).forEach(function (e) { have[e.id] = e; });
      B.lib[c.key] = { name: c.name, version: "", count: c.list.length,
        entries: c.list.map(function (s) { return have[s.id] || JSON.parse(JSON.stringify(s)); }) };
    }
  }
  B.order = [];
  BCOLLS.forEach(function (c) {
    var d = B.lib[c.key];
    if (!d || !Array.isArray(d.entries)) return;
    d.entries.forEach(function (e) { B.order.push({ id: c.key + ":" + e.id, coll: c.key, entry: e }); });
  });
  B.rows = {};
  for (var from = 0; ; from += 1000) {
    var r = await sb.from("batch_definitions").select("*").range(from, from + 999);
    if (r.error) {
      bel("b-cards").innerHTML = '<div style="font-size:13px;color:#A6363C">Run batch-setup in the Supabase SQL Editor first. (' + esc(r.error.message) + ')</div>';
      bel("b-start").disabled = true;
      return;
    }
    r.data.forEach(function (x) { B.rows[x.item_id] = x; });
    if (r.data.length < 1000) break;
  }
  renderBatch();
}

function bStatus(item) { var r = B.rows[item.id]; return r ? r.status : "pending"; }

function renderBatch() {
  var n = { pending: 0, done: 0, approved: 0, rejected: 0, not_found: 0, failed: 0 };
  B.order.forEach(function (it) { n[bStatus(it)]++; });
  var finished = B.order.length - n.pending - n.failed;
  var cards = [
    [finished + " / " + B.order.length, "defined by WiseDefine"],
    [n.done, "to review"], [n.approved, "approved"], [n.rejected, "rejected"],
    [n.not_found, "not recognised"], [n.failed, "failed (will retry)"], [n.pending, "not yet defined"]
  ];
  bel("b-cards").innerHTML = cards.map(function (c) {
    return '<div class="card"><div class="n">' + esc(c[0]) + '</div><div class="l">' + esc(c[1]) + '</div></div>';
  }).join("");
  renderBatchList();
}

function shownItems() {
  var f = bel("b-filter").value, c = bel("b-coll").value, q = (bel("b-q").value || "").toLowerCase();
  return B.order.filter(function (it) {
    if (c !== "all" && it.coll !== c) return false;
    if (f !== "all" && bStatus(it) !== f) return false;
    return !q || it.entry.term.toLowerCase().indexOf(q) !== -1;
  });
}

function renderBatchList() {
  var items = shownItems();
  bel("b-count").textContent = items.length + " shown";
  var box = bel("b-list");
  if (!items.length) { box.innerHTML = '<p style="font-size:13px;color:#6b6b72;margin:0">Nothing here.</p>'; return; }
  box.innerHTML = items.slice(0, B.shown).map(function (it) {
    var row = B.rows[it.id], st = bStatus(it), res = row && row.result, e = it.entry;
    var tags = '<span class="tag">' + esc(BSHORT[it.coll] || it.coll) + '</span><span class="tag">' + esc(e.domain) + '</span>' +
      '<span class="tag ' + (st === "approved" ? "new" : st === "failed" || st === "not_found" ? "filtered" : "") + '">' + esc(st.replace("_", " ").replace("done", "to review")) + '</span>' +
      (row && row.model ? '<span class="tag">' + esc(row.model) + '</span>' : '') + (row && row.cached ? '<span class="tag">saved result</span>' : '');
    var html = '<div class="fb"><div class="meta"><strong style="font-size:15px;color:#14161C">' + esc(e.term) + '</strong> &nbsp;' + tags + '</div>';
    html += '<div style="font-size:13px;margin-bottom:6px"><span style="color:#6b6b72">Current:</span> ' + esc(e.definition) + '</div>';
    if (res && res.definition) {
      html += '<div style="font-size:14px;margin-bottom:6px;padding:8px;background:#f1f6f2;border-radius:4px"><strong>WiseDefine:</strong> ' + esc(res.definition) + '</div>' +
        '<div style="font-size:12px;color:#444;margin-bottom:8px">' +
        (res.standard ? '<div><em>Standard:</em> ' + esc(res.standard) + '</div>' : '') +
        '<div><em>Category:</em> ' + esc(res.category) + '</div><div><em>Identity:</em> ' + esc(res.identity) + '</div>' +
        '<div><em>Mechanism:</em> ' + esc(res.mechanism) + '</div><div><em>Resolved:</em> ' + esc(res.problem) + '</div>' +
        (res.domain ? '<div><em>WiseDefine domain:</em> ' + esc(res.domain) + '</div>' : '') + '</div>';
    }
    if (row && row.error) html += '<div style="font-size:12px;color:#A6363C;margin-bottom:6px">' + esc(row.error) + '</div>';
    html += '<div class="row">';
    if (st === "done" || st === "rejected") html += '<button class="primary" data-ba="approve" data-id="' + esc(it.id) + '">Approve</button>';
    if (st === "approved") html += '<button data-ba="unapprove" data-id="' + esc(it.id) + '">Undo approve</button>';
    if (st === "done" || st === "approved") html += '<button class="danger" data-ba="reject" data-id="' + esc(it.id) + '">Reject (keep current)</button>';
    html += '<button data-ba="regen" data-id="' + esc(it.id) + '">' + (st === "pending" ? "Define now" : "Regenerate") + '</button>';
    html += '</div></div>';
    return html;
  }).join("") + (items.length > B.shown ? '<button id="b-more">Show more (' + (items.length - B.shown) + ' left)</button>' : '');
  box.querySelectorAll("button[data-ba]").forEach(function (b) { b.onclick = function () { batchAct(b); }; });
  var more = bel("b-more");
  if (more) more.onclick = function () { B.shown += 40; renderBatchList(); };
}

async function setRowStatus(id, status) {
  var r = await sb.from("batch_definitions").update({ status: status, updated_at: new Date().toISOString() }).eq("item_id", id);
  if (r.error) { alert("Couldn't save: " + r.error.message); return false; }
  B.rows[id].status = status;
  return true;
}

async function batchAct(b) {
  var id = b.dataset.id, a = b.dataset.ba;
  var it = B.order.find(function (x) { return x.id === id; });
  if (a === "approve") await setRowStatus(id, "approved");
  else if (a === "unapprove") await setRowStatus(id, "done");
  else if (a === "reject") await setRowStatus(id, "rejected");
  else if (a === "regen") {
    if (B.running) { alert("Pause the batch first."); return; }
    b.disabled = true; b.textContent = "Asking WiseDefine…";
    var out = await defineOne(it, bStatus(it) !== "pending");
    if (out.kind === "capacity" || out.kind === "auth" || out.kind === "limit") {
      alert(stopMessage(out));
    } else {
      await saveOutcome(it, out);
    }
  }
  renderBatch();
}

async function approveAllShown() {
  var ids = shownItems().filter(function (it) { return bStatus(it) === "done"; }).map(function (it) { return it.id; });
  if (!ids.length) { alert("Nothing “to review” in this view."); return; }
  if (!confirm("Approve " + ids.length + " definitions?")) return;
  for (var i = 0; i < ids.length; i += 200) {
    var part = ids.slice(i, i + 200);
    var r = await sb.from("batch_definitions").update({ status: "approved", updated_at: new Date().toISOString() }).in("item_id", part);
    if (r.error) { alert("Couldn't save: " + r.error.message); break; }
    part.forEach(function (id) { B.rows[id].status = "approved"; });
  }
  renderBatch();
}

async function sha256Hex(text) {
  var buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(text));
  return Array.from(new Uint8Array(buf)).map(function (x) { return x.toString(16).padStart(2, "0"); }).join("");
}

// One term through the real engine. fresh = forget the saved result first.
async function defineOne(it, fresh) {
  var userContent = "Term: " + it.entry.term;
  try {
    if (fresh) {
      var key = await sha256Hex(LOOKUP_SYSTEM_PROMPT + "\n\n" + userContent);
      await sb.rpc("admin_delete_definition", { p_key: key });
    }
    var s = await sb.auth.getSession();
    var tok = s.data && s.data.session && s.data.session.access_token;
    if (!tok) return { kind: "auth" };
    var resp = await fetch(SUPABASE_URL + "/functions/v1/filter-definition", {
      method: "POST",
      headers: { "Content-Type": "application/json", Authorization: "Bearer " + tok },
      body: JSON.stringify({ system: LOOKUP_SYSTEM_PROMPT, userContent: userContent })
    });
    var text = await resp.text(), data = null;
    try { data = JSON.parse(text); } catch (e) {}
    if (resp.status === 401) return { kind: "auth" };
    if (resp.status === 429) return { kind: data && data.error === "limit_reached" ? "limit" : "capacity" };
    if (!resp.ok || !data) return { kind: "failed", error: "HTTP " + resp.status + ": " + text.slice(0, 200) };
    var model = data.modelVersion || "";
    if (/^gemma/i.test(model) && !bel("b-gemma").checked) return { kind: "capacity", gemma: true };
    var cand = (data.candidates || [])[0];
    var raw = ((cand && cand.content && cand.content.parts) || []).map(function (p) { return p.text || ""; }).join("").trim();
    if (!raw) return { kind: "failed", error: "Empty answer", model: model };
    var m = raw.match(/\{[\s\S]*\}/), parsed;
    try { parsed = JSON.parse(m ? m[0] : raw); } catch (e) { return { kind: "failed", error: "Unreadable answer: " + raw.slice(0, 200), model: model }; }
    if (parsed.error === "not_found") return { kind: "not_found", model: model, cached: !!data.cached };
    if (!parsed.definition) return { kind: "failed", error: "No definition in answer", model: model };
    return { kind: "done", result: parsed, model: model, cached: !!data.cached };
  } catch (e) {
    return { kind: "failed", error: String((e && e.message) || e) };
  }
}

async function saveOutcome(it, out) {
  var prev = B.rows[it.id];
  var row = {
    item_id: it.id, collection: it.coll, term: it.entry.term, status: out.kind,
    result: out.result || (prev && out.kind === "failed" ? prev.result : null),
    model: out.model || null, cached: !!out.cached, error: out.error || null,
    attempts: ((prev && prev.attempts) || 0) + 1, updated_at: new Date().toISOString()
  };
  var r = await sb.from("batch_definitions").upsert(row, { onConflict: "item_id" });
  if (r.error) { bel("b-line").textContent = "Couldn't save “" + it.entry.term + "”: " + r.error.message; return false; }
  B.rows[it.id] = row;
  return true;
}

function nextItem() {
  var p = B.order.find(function (it) { return bStatus(it) === "pending"; });
  if (p) return p;
  return B.order.find(function (it) { return bStatus(it) === "failed" && (B.rows[it.id].attempts || 0) < 3; });
}

function stopMessage(out) {
  if (out.kind === "auth") return "Your sign-in has expired. Sign in again on WiseDefine, come back here and press Start.";
  if (out.kind === "limit") return "The 5-per-day limit still applies to this account — run batch-setup in the Supabase SQL Editor first.";
  return out.gemma
    ? "Gemini's free quota is used up for today (only the Gemma last-resort model is answering)."
    : "The AI quota is used up for now.";
}

function batchPause() {
  B.running = false;
  bel("b-start").disabled = false; bel("b-pause").disabled = true;
  bel("b-line").textContent = "Paused. Press Start to continue.";
}

async function batchStart() {
  if (B.running) return;
  B.running = true;
  bel("b-start").disabled = true; bel("b-pause").disabled = false;
  while (B.running) {
    var it = nextItem();
    if (!it) { batchPause(); bel("b-line").textContent = "Every term has been through WiseDefine. Review them below, then export."; break; }
    bel("b-line").textContent = "Defining “" + it.entry.term + "”…";
    var out = await defineOne(it, false);
    if (!B.running) break;
    if (out.kind === "capacity") {
      if (!bel("b-wait").checked) { batchPause(); bel("b-line").textContent = stopMessage(out) + " Press Start later — Gemini's daily quota resets around 10–11 am Ethiopia time."; break; }
      var until = Date.now() + 30 * 60 * 1000;
      while (B.running && Date.now() < until) {
        var mins = Math.ceil((until - Date.now()) / 60000);
        bel("b-line").textContent = stopMessage(out) + " Trying again in " + mins + " min… (keep this page open, or Pause and press Start another day)";
        await bsleep(5000);
      }
      continue;
    }
    if (out.kind === "auth" || out.kind === "limit") { batchPause(); bel("b-line").textContent = stopMessage(out); break; }
    await saveOutcome(it, out);
    renderBatch();
    var wait = Math.max(2, Number(bel("b-delay").value) || 13) * 1000, end = Date.now() + wait;
    while (B.running && Date.now() < end) await bsleep(500);
  }
}

function exportColl(key) {
  var d = B.lib[key];
  if (!d) { alert("That library file couldn't be loaded."); return; }
  var withDone = bel("b-exp-done").checked;
  var copy = JSON.parse(JSON.stringify(d)), n = 0;
  copy.entries.forEach(function (e) {
    var row = B.rows[key + ":" + e.id], res = row && row.result;
    if (!row || !res || !res.definition) return;
    if (!(row.status === "approved" || (withDone && row.status === "done"))) return;
    e.definition = res.definition;
    e.fields = { category: res.category, identity: res.identity, mechanism: res.mechanism, problem: res.problem };
    if (res.standard) e.standard = res.standard;
    if (res.domain) e.engineDomain = res.domain;
    e.definedBy = "WiseDefine";
    n++;
  });
  // Terms nobody has defined yet stay out of the published file.
  copy.entries = copy.entries.filter(function (e) { return e.definition; });
  copy.count = copy.entries.length;
  copy.version = new Date().toISOString().slice(0, 10);
  var blob = new Blob([JSON.stringify(copy)], { type: "application/json" });
  var a = document.createElement("a");
  a.href = URL.createObjectURL(blob); a.download = key + ".json";
  document.body.appendChild(a); a.click(); a.remove();
  bel("b-exp-msg").textContent = key + ".json downloaded — " + n + " of " + copy.entries.length + " terms carry WiseDefine's new definition.";
}

start();
</script>
